<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Opened from the iPhone Home Screen it runs full screen, without Safari bars. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Peggy Makeover</title>
  <!-- All styles and scripts are inlined: this one file is the whole prototype (images stay in assets/). -->
  <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/*
 * Stage = iPhone screen in landscape (2868×1320, ratio 2.1727); the frame is
 * styled after iPhone 14 (corner radius, notch).
 * The game is laid out at a fixed design size (1300×598) and the whole stage
 * is scaled with --stage-scale to fit the phone screen, so every icon, HUD
 * element, VFX and number keeps its proportions on any display.
 * --stage-scale and --screen-w are set by the fit script in index.html.
 */
:root {
  --stage-w: 1300px;
  --stage-h: 598px;
  --stage-scale: 1;
  --screen-w: 1300px;

  --titan-hi: #9aa0a8;
  --titan-mid: #4a4e55;
  --titan-lo: #1c1e21;
  --page-bg-1: #262b33;
  --page-bg-2: #0d0f13;
  --btn-bg: #ffffff;
  --btn-fg: #1b1e24;
  --btn-active-bg: #ffb300;
  --btn-active-fg: #2a1a00;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, var(--page-bg-1), var(--page-bg-2));
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.viewport {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 2.4vh, 28px);
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- iPhone 17 Pro Max body, landscape ---------- */
.iphone {
  --bezel: calc(var(--screen-w) * 0.017);
  position: relative;
  flex: none;
  padding: var(--bezel);
  /* iPhone 14: screen corner radius + bezel (less rounded than before) */
  border-radius: calc(var(--screen-w) * 0.073);
  background: #050506;
  /* Titanium band around the glass */
  box-shadow:
    0 0 0 calc(var(--screen-w) * 0.0022) var(--titan-hi),
    0 0 0 calc(var(--screen-w) * 0.0045) var(--titan-mid),
    0 0 0 calc(var(--screen-w) * 0.0055) var(--titan-lo),
    0 calc(var(--screen-w) * 0.02) calc(var(--screen-w) * 0.05) rgba(0, 0, 0, 0.55);
}

/* Side buttons: the top of the phone points left, so the volume side is
   along the bottom edge and the power / camera side along the top edge. */
.iphone-btn {
  position: absolute;
  height: calc(var(--screen-w) * 0.0035);
  border-radius: 2px;
  background: linear-gradient(180deg, var(--titan-hi), var(--titan-mid), var(--titan-lo));
}
.iphone-btn.action { bottom: calc(var(--screen-w) * -0.0085); left: 16%; width: 3.4%; }
.iphone-btn.vol-up { bottom: calc(var(--screen-w) * -0.0085); left: 22%; width: 6.4%; }
.iphone-btn.vol-dn { bottom: calc(var(--screen-w) * -0.0085); left: 30%; width: 6.4%; }
.iphone-btn.power  { top: calc(var(--screen-w) * -0.0085); left: 24%; width: 9.5%; }
.iphone-btn.camera { top: calc(var(--screen-w) * -0.0085); left: 60%; width: 4.8%; }

/* ---------- Screen ---------- */
.device {
  position: relative;
  width: var(--screen-w);
  /* same ratio as the design stage, so the scaled stage fills it exactly */
  height: calc(var(--screen-w) * 598 / 1300);
  /* iPhone 14 display corner radius ≈ 47pt on an 844pt-wide screen */
  border-radius: calc(var(--screen-w) * 0.056);
  overflow: hidden;
  background: #000;
}

/*
 * iPhone 14 notch, on the left edge in landscape (the top of the phone points
 * left). Real proportions: ~162pt long and ~33pt deep on a 390×844pt screen,
 * with rounded inner corners and small concave fillets where it meets the
 * screen edge. Purely decorative.
 */
.notch {
  --notch-len: calc(var(--screen-w) * 0.191);
  --notch-depth: calc(var(--screen-w) * 0.039);
  --notch-r: calc(var(--screen-w) * 0.021);
  --notch-fillet: calc(var(--screen-w) * 0.008);
  position: absolute;
  left: 0;
  top: 50%;
  width: var(--notch-depth);
  height: var(--notch-len);
  transform: translateY(-50%);
  border-radius: 0 var(--notch-r) var(--notch-r) 0;
  background: #050506;
  z-index: 100;
  pointer-events: none;
}

/* Concave fillets that blend the notch into the screen edge. */
.notch::before,
.notch::after {
  content: "";
  position: absolute;
  left: 0;
  width: var(--notch-fillet);
  height: var(--notch-fillet);
}
.notch::before {
  bottom: 100%;
  background: radial-gradient(
    circle at 100% 0,
    transparent calc(var(--notch-fillet) - 0.5px),
    #050506 var(--notch-fillet)
  );
}
.notch::after {
  top: 100%;
  background: radial-gradient(
    circle at 100% 100%,
    transparent calc(var(--notch-fillet) - 0.5px),
    #050506 var(--notch-fillet)
  );
}

/* Earpiece slot and front camera inside the notch. */
.notch-speaker {
  position: absolute;
  left: 38%;
  top: 50%;
  width: calc(var(--screen-w) * 0.0032);
  height: calc(var(--screen-w) * 0.042);
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: #1c1d20;
}
.notch-camera {
  position: absolute;
  left: 42%;
  top: 22%;
  width: calc(var(--screen-w) * 0.0085);
  height: calc(var(--screen-w) * 0.0085);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #3b4a6b 0%, #141a28 45%, #08090c 70%);
}

/* Debug controls, outside the phone screen: oval pills that scale with the window. */
.controls {
  display: flex;
  /* wider spacing between the pills; pushed 30px further below the phone */
  gap: clamp(18px, 2.6vw, 36px);
  margin-top: 30px;
  flex-wrap: wrap;
  justify-content: center;
}

.control-btn {
  appearance: none;
  /* 20% larger than before */
  padding: clamp(9.6px, 1.32vw, 16.8px) clamp(21.6px, 2.88vw, 38.4px);
  border: 0;
  border-radius: 999px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-family: inherit;
  font-weight: 600;
  font-size: clamp(14.4px, 1.44vw, 20.4px);
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  cursor: pointer;
  transition: transform 0.12s ease, background-color 0.15s ease;
}

.control-btn:hover {
  transform: translateY(-1px);
}

.control-btn:active {
  transform: scale(0.97);
}

.control-btn.is-active {
  background: var(--btn-active-bg);
  color: var(--btn-active-fg);
}

.control-btn:focus-visible {
  outline: 3px solid #7fb8ff;
  outline-offset: 3px;
}

/* Fixed design size, scaled to fill the phone screen. */
.stage {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--stage-w);
  height: var(--stage-h);
  transform: scale(var(--stage-scale));
  transform-origin: 0 0;
  overflow: hidden;
  background: #000;
  user-select: none;
}

/* Opened on a real phone: no mock-up, the game fills the screen. */
.is-bare .viewport {
  padding: 0;
}
.is-bare .iphone {
  padding: 0;
  border-radius: 0;
  box-shadow: none;
}
.is-bare .iphone-btn,
.is-bare .notch {
  display: none;
}
.is-bare .device {
  border-radius: 0;
}
.is-bare .controls {
  margin-top: 0;
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  z-index: 200;
  gap: 6px;
}
.is-bare .control-btn {
  padding: 6px 12px;
  font-size: 11px;
  opacity: 0.85;
}

@media (prefers-reduced-motion: reduce) {
  .control-btn {
    transition: none;
  }
}

.play-area {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.hud-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  --hud-btn-h: 68px;
}

/* Header.png over Milestones_Bar1.png, centered near the top.
   Box matches the two pictures at the same scale: title 774×115, bar 1060×279. */
.hud-top-wrap {
  position: absolute;
  top: 7px;
  left: 50%;
  transform: translateX(-50%);
  height: 161px;
  width: auto;
  aspect-ratio: 1060 / 394;
  max-width: 92%;
  line-height: 0;
  container-type: size;
}

.hud-top {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center top;
  display: block;
  pointer-events: none;
}

/*
 * Two pictures stacked in one 1060×394 box, same scale as the source files:
 *   Header.png           (774×115) — "Peggy Makeover" title, top, centred
 *   Milestones_Bar1.png  (1060×279) — the panel, full box width, under the title
 * 115/394 of the box is the title, 279/394 is the panel.
 */
.hud-top-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hud-title {
  display: block;
  height: 29.2%;
  width: auto;
  max-width: 100%;
  aspect-ratio: 774 / 115;
  flex: none;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  position: relative;
  z-index: 1;
}
.hud-milestones {
  display: block;
  width: 100%;
  height: auto;
  /* keeps the picture's own proportions; never taller than the space under the title */
  max-height: 70.8%;
  flex: none;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
}

/* Info button: left corner, 30px from left, 68px tall. */
.hud-info {
  position: absolute;
  top: 20px;
  left: 30px;
  height: var(--hud-btn-h);
  width: auto;
  aspect-ratio: 70 / 73;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
  line-height: 0;
  z-index: 11;
}

.hud-info img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

/* EventSkuMeter: 30px right of info, 68px tall. */
.hud-meter {
  position: absolute;
  top: 10px;
  left: calc(30px + var(--hud-btn-h) * 70 / 73 + 10px);
  height: var(--hud-btn-h);
  width: auto;
  aspect-ratio: 254 / 149;
  object-fit: contain;
  object-position: left center;
  display: block;
  pointer-events: none;
  z-index: 10;
}

/* Currency counter overlaid on EventSkuMeter. */
.hud-top-count {
  position: absolute;
  /* Sits exactly on the black pill of EventSkuMeter.png (254×149 px picture):
     pill = x 69–253, y 44–113 in picture pixels; one picture pixel = --hud-btn-h / 149. */
  --meter-px: calc(var(--hud-btn-h) / 149);
  top: calc(10px + 44 * var(--meter-px));
  left: calc(30px + var(--hud-btn-h) * 70 / 73 + 10px + 69 * var(--meter-px));
  height: calc(70 * var(--meter-px));
  width: calc(185 * var(--meter-px));
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  padding: 0;
  background: transparent;
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  line-height: 1;
  text-align: center;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  pointer-events: none;
  white-space: nowrap;
  z-index: 11;
}

/* Close button: 68px tall, 30px from right. */
.hud-close {
  position: absolute;
  top: 20px;
  right: 30px;
  height: var(--hud-btn-h);
  width: auto;
  aspect-ratio: 66 / 68;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
  line-height: 0;
  z-index: 11;
}

.hud-close img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

.state-b {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  pointer-events: none;
}

.voronoi-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.voronoi-layer .cell.is-gone {
  pointer-events: none;
  visibility: hidden;
}

/* Sam in the far bottom-left corner; both faces share one box so the swap
   keeps the exact same position and size. */
.sam {
  position: absolute;
  left: 0;
  bottom: -10px;
  height: 74.13%;
  /* Matches the artwork so the box has no dead space around the character. */
  aspect-ratio: 640 / 956;
  pointer-events: none;
  /* Pulls the transparent padding off-screen so Sam hugs the left edge. */
  transform: translateX(var(--sam-shift, 0px));
  /* Above the scene, numbers and the sponge VFX — nothing covers Sam. */
  z-index: 11;
}

.sam.is-happy {
  animation: sam-cheer 620ms cubic-bezier(0.3, 1.5, 0.5, 1) both;
  transform-origin: 50% 100%;
}

@keyframes sam-cheer {
  0% {
    transform: translateX(var(--sam-shift, 0px)) scale(1);
  }
  35% {
    transform: translateX(var(--sam-shift, 0px)) scale(1.12) translateY(-2%);
  }
  100% {
    transform: translateX(var(--sam-shift, 0px)) scale(1);
  }
}

/* Sparkle burst over Sam when he cheers up. */
.sam-sparkles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 12;
  overflow: visible;
}

.sam-face {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: left bottom;
  filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45));
  transition: opacity 0.35s ease;
}

.sam-face.is-happy {
  opacity: 0;
}

.sam.is-happy .sam-face.is-sad {
  opacity: 0;
}

.sam.is-happy .sam-face.is-happy {
  opacity: 1;
}

.icons-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}

.vfx-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
  z-index: 4;
}

.dust-layer {
  display: none !important;
}

/* wipe7 liquid-splash matte drawn over the piece while it clears. */
.brush-wipe-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: block;
  z-index: 1;
}

.sponge-sparkles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
}

.sponge-fx {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 8;
  overflow: visible;
}

.sponge-sprite {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--sponge-size, 101px);
  height: var(--sponge-size, 101px);
  object-fit: contain;
  opacity: 1;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45));
  will-change: transform, opacity;
  transform-origin: 50% 50%;
}

.sponge-sparkle {
  position: absolute;
  margin: 0;
  transform: translate(-50%, -50%) scale(0.2);
  opacity: 0;
  background: #fff;
  clip-path: polygon(
    50% 0%,
    62% 38%,
    100% 50%,
    62% 62%,
    50% 100%,
    38% 62%,
    0% 50%,
    38% 38%
  );
  filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.9));
  animation: sponge-sparkle-pop var(--sparkle-dur, 560ms) ease-out
    var(--sparkle-delay, 0ms) forwards;
}

@keyframes sponge-sparkle-pop {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.15) rotate(0deg);
  }
  25% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.15) rotate(12deg);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -58%) scale(0.35) rotate(-8deg);
  }
}

/* Wet lather smeared by the sponge; fades a few frames behind it. */
.sponge-foam-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: block;
  z-index: 2;
}

/* Soap bubbles: iridescent shell, rise off the sponge and pop. */
.soap-bubble {
  position: absolute;
  margin: 0;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  z-index: 58;
  /* Transparent film: colour lives in the rim, the centre stays see-through. */
  background: radial-gradient(
      circle at 32% 27%,
      rgba(255, 255, 255, 0.85) 0%,
      rgba(255, 255, 255, 0.18) 16%,
      rgba(255, 255, 255, 0) 38%
    ),
    radial-gradient(
      circle at 50% 50%,
      rgba(255, 255, 255, 0) 52%,
      rgba(175, 230, 255, 0.3) 74%,
      rgba(255, 205, 245, 0.42) 88%,
      rgba(230, 255, 240, 0.7) 100%
    );
  box-shadow:
    inset 0 0 4px rgba(255, 255, 255, 0.55),
    0 0 5px rgba(200, 240, 255, 0.35);
  will-change: transform, opacity;
  animation: soap-bubble-float var(--bubble-dur, 1100ms)
    cubic-bezier(0.22, 0.7, 0.3, 1) var(--bubble-delay, 0ms) forwards;
}

.soap-bubble::after {
  content: "";
  position: absolute;
  left: 24%;
  top: 20%;
  width: 24%;
  height: 17%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  transform: rotate(-20deg);
}

@keyframes soap-bubble-float {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.2);
  }
  14% {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(var(--bubble-scale, 1));
  }
  55% {
    opacity: 0.9;
    transform: translate(
        calc(-50% + var(--bubble-dx, 0px) * 0.6),
        calc(-50% + var(--bubble-dy, -40px) * 0.6)
      )
      scale(calc(var(--bubble-scale, 1) * 1.04));
  }
  88% {
    opacity: 0.7;
    transform: translate(
        calc(-50% + var(--bubble-dx, 0px)),
        calc(-50% + var(--bubble-dy, -40px))
      )
      scale(calc(var(--bubble-scale, 1) * 1.1));
  }
  /* Pop. */
  100% {
    opacity: 0;
    transform: translate(
        calc(-50% + var(--bubble-dx, 0px)),
        calc(-50% + var(--bubble-dy, -40px))
      )
      scale(calc(var(--bubble-scale, 1) * 1.5));
  }
}

.cell-icon {
  position: absolute;
  width: 84px;
  height: 98px;
  margin: -54px 0 0 -42px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0;
  transition: opacity 0.25s ease, transform 0.28s ease-out;
  transform: translate(0, 0) scale(1);
}

/* Attention hint: when the player leaves the pieces alone, the numbers pulse twice.
   (Uses the separate `scale` property, so it never fights the transform used for flying/hiding.) */
.cell-icon.is-hint {
  animation: cell-hint-pulse 0.75s cubic-bezier(0.45, 0, 0.55, 1) 2;
}

@keyframes cell-hint-pulse {
  0%,
  100% {
    scale: 1;
  }
  50% {
    scale: 1.12;
  }
}

/* Back layer: black circle @ 50% opacity */
.cell-icon-plate {
  position: absolute;
  left: 50%;
  top: 44%;
  /* 20% larger than the original 64px */
  width: 77px;
  height: 77px;
  margin: 0;
  box-sizing: border-box;
  border-radius: 50%;
  /* black circle at 60% */
  background: rgba(0, 0, 0, 0.6);
  /* 1px white outline, softened (blurred) edge */
  border: 1px solid rgba(255, 255, 255, 0.8);
  /* blur the outline + small white glow around the circle */
  box-shadow:
    0 0 2px 0 rgba(255, 255, 255, 0.7),
    inset 0 0 2px 0 rgba(255, 255, 255, 0.45),
    0 0 10px 3px rgba(255, 255, 255, 0.5),
    0 0 22px 7px rgba(255, 255, 255, 0.3);
  /* frosted blur of the picture behind the circle (20px + 30%) */
  -webkit-backdrop-filter: blur(var(--plate-blur, 26px));
  backdrop-filter: blur(var(--plate-blur, 26px));
  transform: translate(-50%, -50%);
  z-index: 1;
  pointer-events: none;
}

/* Middle: SKU icon above the number */
.cell-icon-sku {
  position: relative;
  z-index: 2;
  width: 58px;
  height: auto;
  margin-top: 0;
  object-fit: contain;
  pointer-events: none;
  display: block;
  order: 1;
}

/* Front: number below icon, tucked slightly up onto it */
.cell-icon-label {
  position: relative;
  z-index: 3;
  order: 2;
  margin-top: -18px;
  font-size: 19.2pt;
  font-weight: 800;
  line-height: 1;
  color: #fff;
  -webkit-text-stroke: 3px #000;
  paint-order: stroke fill;
  text-shadow: 0 2px 0 #000;
  pointer-events: none;
}

.cell-icon.is-fading {
  opacity: 0;
  transform: translate(0, 0) scale(1.3);
  pointer-events: none;
}

.cell-icon.is-gone {
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
}

/* Extra dark strip along the very top of every dark screen (result screens and "How to play"):
   80% black at the top, melting away towards the bottom. It keeps the proportions of the design
   file (2560 x 599), so it scales with the screen width, and it sits behind the pictures. */
.reward-screen::before,
.info-overlay::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  aspect-ratio: 2560 / 599;
  max-height: 70%;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.8) 5%, rgba(0, 0, 0, 0.8) 10%, rgba(0, 0, 0, 0.8) 15%, rgba(0, 0, 0, 0.8) 20%, rgba(0, 0, 0, 0.8) 25%, rgba(0, 0, 0, 0.8) 30%, rgba(0, 0, 0, 0.8) 35%, rgba(0, 0, 0, 0.793) 40%, rgba(0, 0, 0, 0.78) 45%, rgba(0, 0, 0, 0.753) 50%, rgba(0, 0, 0, 0.701) 55%, rgba(0, 0, 0, 0.616) 60%, rgba(0, 0, 0, 0.494) 65%, rgba(0, 0, 0, 0.349) 70%, rgba(0, 0, 0, 0.212) 75%, rgba(0, 0, 0, 0.105) 80%, rgba(0, 0, 0, 0.04) 85%, rgba(0, 0, 0, 0.012) 90%, rgba(0, 0, 0, 0.003) 95%, rgba(0, 0, 0, 0) 100%);
  pointer-events: none;
}

/* Result screens: one 80% dark layer that stays put while the picture on it changes.
   - after every scene: "Stage Completed!" picture
   - after the last scene: "The Makeover Completed!" picture, then the "Let's Go Again!" card. */
.reward-screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease, background 0.45s ease;
  z-index: 50;
  cursor: pointer;
}

.reward-screen[hidden] {
  display: none;
}

.reward-screen.is-visible {
  background: rgba(0, 0, 0, 0.8);
  opacity: 1;
  pointer-events: auto;
}

/* The "Stage Completed!" / "The Makeover Completed!" picture, as big as fits. */
.reward-popup {
  position: absolute;
  inset: 0;
  margin: auto;
  width: auto;
  height: 100%;
  max-width: 100%;
  object-fit: contain;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  opacity: 0;
  transform: scale(0.94);
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 1.2, 0.4, 1);
}

.reward-screen.is-visible .reward-popup {
  opacity: 1;
  transform: scale(1);
}

/* Broom and coins of the Makeover screen: fixed to the two bottom corners of the screen, sized
   by the screen height, so they move apart or together as the screen gets wider or narrower. */
.reward-corner {
  position: absolute;
  bottom: 0;
  height: 58%;
  width: auto;
  max-width: 46%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  opacity: 0;
  transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
}

.reward-corner.is-left {
  left: 0;
  height: 72%;
  object-position: left bottom;
  transform: translate(-8%, 6%);
}

.reward-corner.is-right {
  right: 0;
  height: 68%;
  object-position: right bottom;
  transform: translate(8%, 6%);
}

.reward-screen.is-makeover.is-visible .reward-corner {
  opacity: 1;
  transform: none;
}

/* When the "Let's Go Again!" card comes in, the broom slides out to the left and the coins
   slide out to the right, off the screen. */
.reward-screen.is-makeover.is-visible.is-replay .reward-corner {
  opacity: 1;
  transition: transform 0.75s cubic-bezier(0.55, 0, 0.85, 0.35), opacity 0.2s ease 0.6s;
}

.reward-screen.is-makeover.is-visible.is-replay .reward-corner.is-left {
  transform: translateX(-110%);
  opacity: 0;
}

.reward-screen.is-makeover.is-visible.is-replay .reward-corner.is-right {
  transform: translateX(110%);
  opacity: 0;
}

/* Black screen the game fades through when it moves on to the next scene or starts over. */
.blackout {
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  z-index: 70;
}

.blackout.is-on {
  opacity: 1;
  pointer-events: auto;
}

/* Start screen. It covers everything; a tap fades through white into the first scene. */
.splash {
  position: absolute;
  inset: 0;
  z-index: 80;
  background: #000;
  cursor: pointer;
  overflow: hidden;
}

.splash[hidden] {
  display: none;
}

/* Fills the screen; the bottom of the picture (the "Tap to continue" line) is kept in view. */
.splash-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 85%;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

/* White screen used for the fade from the start screen into the game. */
.whiteout {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  z-index: 90;
}

.whiteout.is-on {
  opacity: 1;
  pointer-events: auto;
}

/* The "Let's Go Again!" card. */
.replay-card {
  position: relative;
  height: 86%;
  aspect-ratio: 1285 / 1040;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.92);
  transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 1.2, 0.4, 1);
}

.reward-screen.is-replay {
  cursor: default;
}

.reward-screen.is-replay .reward-popup {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}

.reward-screen.is-replay .replay-card {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.replay-card-img {
  width: 100%;
  height: 100%;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

/* Invisible tap area exactly over the green Replay button in the picture. */
.replay-button {
  position: absolute;
  left: 35.4%;
  top: 84.1%;
  width: 29.2%;
  height: 13.8%;
  padding: 0;
  border: 0;
  border-radius: 40%;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.replay-button:active {

}

/* Falling gold stars + corner spotlights, above the reward overlay. */
.spotlight-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 13;
  transition: opacity 0.4s ease;
}

.spotlight-layer.is-leaving {
  opacity: 0;
}

.spotlight-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.celebrate-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  overflow: hidden;
  opacity: 0;
}

.celebrate-layer.is-active {
  opacity: 1;
}

.celebrate-glow {
  position: absolute;
  inset: auto;
  border-radius: 42% 48% 38% 44%;
  background: radial-gradient(
      ellipse at 50% 42%,
      rgba(255, 248, 210, 0.28) 0%,
      rgba(255, 220, 130, 0.1) 42%,
      rgba(255, 255, 255, 0) 70%
    ),
    radial-gradient(
      circle at 30% 55%,
      rgba(255, 255, 255, 0.12) 0%,
      transparent 45%
    ),
    radial-gradient(
      circle at 72% 40%,
      rgba(255, 240, 180, 0.12) 0%,
      transparent 48%
    );
  animation: celebrate-glow-pulse 1.2s ease-in-out infinite alternate;
  mix-blend-mode: screen;
  pointer-events: none;
}

@keyframes celebrate-glow-pulse {
  from {
    opacity: 0.4;
    transform: scale(0.99);
  }
  to {
    opacity: 0.75;
    transform: scale(1.02);
  }
}

.celebrate-sparkle {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: 0;
  pointer-events: none;
  opacity: 0;

/* Thin 4-point star */

    circle at 50% 50%,
    rgba(255, 255, 255, 1) 0%,
    rgba(255, 248, 210, 0.85) 22%,
    rgba(255, 220, 120, 0.12) 48%,
    transparent 64%
  );
  clip-path: polygon(
    50% 0%,
    54% 42%,
    100% 50%,
    54% 58%,
    50% 100%,
    46% 58%,
    0% 50%,
    46% 42%
  );
  filter: drop-shadow(0 0 2px rgba(255, 245, 190, 0.9))
    drop-shadow(0 0 6px rgba(255, 220, 120, 0.45));
}

/* Soft cross glint */
.celebrate-sparkle.is-glint {
  background:
    linear-gradient(
      90deg,
      transparent 46%,
      rgba(255, 255, 255, 0.95) 50%,
      transparent 54%
    ),
    linear-gradient(
      0deg,
      transparent 46%,
      rgba(255, 250, 220, 0.9) 50%,
      transparent 54%
    ),
    radial-gradient(
      circle,
      rgba(255, 255, 255, 0.9) 0%,
      rgba(255, 230, 150, 0.35) 30%,
      transparent 58%
    );
  border-radius: 50%;
  filter: drop-shadow(0 0 3px rgba(255, 240, 170, 0.75));
}

/* Tiny mote */
.celebrate-sparkle.is-twinkle {
  background: radial-gradient(
    circle,
    rgba(255, 255, 255, 0.95) 0%,
    rgba(255, 240, 180, 0.55) 40%,
    transparent 72%
  );
  border-radius: 50%;
  filter: drop-shadow(0 0 2px rgba(255, 235, 160, 0.7));
}

@keyframes celebrate-sparkle-pop {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.35)
      rotate(var(--spark-rot, 0deg));
  }
  18% {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1)
      rotate(calc(var(--spark-rot, 0deg) + 6deg));
  }
  42% {
    opacity: 0.55;
    transform: translate(-50%, -51%) scale(0.7)
      rotate(calc(var(--spark-rot, 0deg) - 2deg));
  }
  68% {
    opacity: 1;
    transform: translate(-50%, -51%) scale(1.05)
      rotate(calc(var(--spark-rot, 0deg) + 4deg));
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -54%) scale(0.3)
      rotate(calc(var(--spark-rot, 0deg) - 8deg));
  }
}

/* ---------- "How to play?" info overlay ---------- */
/* While it is open the HUD layer is lifted above everything (reward screen
   included); inside it the overlay covers the HUD and only Close stays on top. */
.hud-layer.is-info-open {
  z-index: 60;
}

.info-overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  pointer-events: auto;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.info-overlay[hidden] {
  display: none;
}

.info-overlay.is-visible {
  opacity: 1;
}

.info-screen {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;

.hud-layer.is-info-open .hud-close {

}

@media (prefers-reduced-motion: reduce) {

/* Info and Close buttons 20% smaller, each kept centred on its old spot

.hud-info,

  top: calc(20px + var(--hud-btn-h) * 0.1);
}
.hud-info {
  left: calc(30px + var(--hud-btn-h) * 70 / 73 * 0.1);
}
.hud-close {
  right: calc(30px + var(--hud-btn-h) * 66 / 68 * 0.1);

/* ---------- Dust brush clean ---------- */
.brush-fx {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 8;
  overflow: visible;
}

.brush-sprite {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 2; /* above its own dust clouds */
  object-fit: contain;
  filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
  will-change: transform, opacity;
  user-select: none;
}

/* Soft, lumpy dust cloud: a blurred blob with two smaller lumps. */
.dust-puff {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(
    circle at 45% 45%,
    rgba(255, 186, 210, 0.92) 0%,
    rgba(255, 140, 184, 0.72) 40%,
    rgba(244, 112, 168, 0.32) 64%,
    rgba(236, 130, 176, 0) 78%
  );
  filter: blur(3.5px);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.35);
  animation: dust-puff var(--puff-dur, 900ms) cubic-bezier(0.2, 0.7, 0.3, 1)
    var(--puff-delay, 0ms) forwards;
  will-change: transform, opacity;
}

.dust-puff::before,
.dust-puff::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: inherit;
}

.dust-puff::before {
  width: 70%;
  height: 70%;
  left: -22%;
  top: 28%;
}

.dust-puff::after {
  width: 58%;
  height: 58%;
  right: -18%;
  top: 8%;
}

@keyframes dust-puff {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.35) rotate(0deg);
  }
  18% {
    opacity: var(--puff-alpha, 0.8);
  }
  55% {
    opacity: calc(var(--puff-alpha, 0.8) * 0.7);
  }
  100% {
    opacity: 0;
    transform: translate(
        calc(-50% + var(--puff-dx, 0px)),
        calc(-50% + var(--puff-dy, -20px))
      )
      scale(var(--puff-scale, 1.8)) rotate(var(--puff-rot, 0deg));
  }
}

/* Bright star that rides with a pink puff so the powder reads as magical. */
.magic-spark {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  margin: 0;
  opacity: 0;
  background: #fff;
  clip-path: polygon(
    50% 0%,
    62% 38%,
    100% 50%,
    62% 62%,
    50% 100%,
    38% 62%,
    0% 50%,
    38% 38%
  );
  filter: drop-shadow(0 0 3px rgba(255, 228, 240, 0.95));
  animation: magic-spark var(--puff-dur, 700ms) ease-out
    var(--puff-delay, 0ms) forwards;
}

.magic-spark.is-gold {
  background: #ffe7a8;
  filter: drop-shadow(0 0 3px rgba(255, 210, 140, 0.95));
}

.magic-spark.is-pink {
  background: #ffd4e8;
  filter: drop-shadow(0 0 3px rgba(255, 170, 205, 0.95));
}

@keyframes magic-spark {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.15) rotate(0deg);
  }
  22% {
    opacity: 1;
    transform: translate(
        calc(-50% + var(--puff-dx, 0px) * 0.28),
        calc(-50% + var(--puff-dy, -24px) * 0.28)
      )
      scale(1.1) rotate(16deg);
  }
  100% {
    opacity: 0;
    transform: translate(
        calc(-50% + var(--puff-dx, 0px)),
        calc(-50% + var(--puff-dy, -24px))
      )
      scale(0.28) rotate(-14deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .dust-puff,
  .magic-spark {
    animation-duration: 1ms;
  }
}

/* Tapped icon: number and circle vanish, the icon brush is replaced by the
   moving cleaning brush in the same frame. */
/* Brush icon on each piece: 20% larger. Scaled around its lower part so the
   number stays in the same place on it; the layout box is unchanged. */
.cell-icon-sku {
  /* 1.2 × 1.2 = 44% larger than the original picture, 10px lower */
  transform: translateY(10px) scale(1.44);
  transform-origin: 50% 75%;
}

.cell-icon.is-cleaning {
  pointer-events: none;
}
.cell-icon.is-cleaning .cell-icon-plate,
.cell-icon.is-cleaning .cell-icon-label {
  opacity: 0;
  transition: opacity 0.15s ease;
}
.cell-icon.is-cleaning .cell-icon-sku {
  visibility: hidden;
}


/* ---------- Real phone held upright: ask to turn it ---------- */
.rotate-hint {
  display: none;
}
.is-bare.is-portrait .rotate-hint {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;

@keyframes rotate-hint {

.is-bare.is-portrait .viewport {

}
@media (prefers-reduced-motion: reduce) {
  .rotate-hint-phone { animation: none; transform: rotate(-90deg); }
}

  <!-- Fits the phone to the window and scales the fixed-size stage (1300×598) into its screen. -->
  <script>
    (function () {
      var DESIGN_W = 1300;
      var DESIGN_H = 598;
      var root = document.documentElement;

      function isRealPhone() {
        var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
        return coarse && Math.min(window.innerWidth, window.innerHeight) < 600;
      }

      function fit() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var screenW;

        // Real phone held upright: the game is landscape, so ask to turn it.
        root.classList.toggle("is-portrait", isRealPhone() && h > w);

        if (isRealPhone()) {
          root.classList.add("is-bare");
          screenW = Math.min(w, (h * DESIGN_W) / DESIGN_H);
        } else {
          root.classList.remove("is-bare");
          // controls height + gap to the phone + the extra 30px margin above the buttons
          var controlsH = 28 + 30;
          // Phone body ≈ 1.05 × screen width wide and ≈ 0.50 × screen width tall.
          var byWidth = (w - 32) / 1.05;
          var byHeight = (h - controlsH - 40) / 0.5;
          // PHONE_SIZE: 1 = as large as fits the window, 0.8 = 20% smaller.
          var PHONE_SIZE = 0.8;
          screenW = Math.max(200, Math.min(byWidth, byHeight) * PHONE_SIZE);

  const EPS = 1e-9;
  /** Pixels each cell grows by so adjacent pieces overlap instead of leaving a seam. */
  const SEAM_OVERLAP = 2.5;

  function distSq(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return dx * dx + dy * dy;
  }

  function dot(a, b) {
    return a.x * b.x + a.y * b.y;
  }

  /** Negative margin bleeds the cells past the stage so no edge stays uncovered. */
  function rectPolygon(width, height, margin = 0) {

      { x: margin, y: margin },
      { x: width - margin, y: margin },
      { x: width - margin, y: height - margin },
      { x: margin, y: height - margin },
    ];

  /** Keep points closer to siteA than to siteB. */
  function clipHalfPlane(polygon, siteA, siteB) {
    if (polygon.length === 0) return [];

    const origin = { x: 0, y: 0 };
    const d = { x: siteB.x - siteA.x, y: siteB.y - siteA.y };
    const c = distSq(siteB, origin) - distSq(siteA, origin);

    function inside(p) {
      return 2 * dot(d, p) <= c + EPS;

    function intersect(p1, p2) {

      const denom = 2 * dot(d, dp);
      if (Math.abs(denom) < EPS) return { x: p1.x, y: p1.y };

        y: p1.y + t * dp.y,

    for (let i = 0; i < polygon.length; i++) {

      const previous = polygon[(i + polygon.length - 1) % polygon.length];
      const currIn = inside(current);
      const prevIn = inside(previous);

      if (currIn) {

        sy += p.y;

    let cx = 0;
    let cy = 0;
    for (let i = 0; i < polygon.length; i++) {
      const p0 = polygon[i];
      const p1 = polygon[(i + 1) % polygon.length];
      const cross = p0.x * p1.y - p1.x * p0.y;
      area += cross;
      cx += (p0.x + p1.x) * cross;
      cy += (p0.y + p1.y) * cross;

    if (Math.abs(area) < EPS) {
      let sx = 0;
      let sy = 0;
      for (const p of polygon) {

        sy += p.y;

    for (let i = 0; i < polygon.length; i++) {

    const areas = cells.map((c) => c.area).filter((a) => a > EPS);

   * How many seeds sit on each row. Rows are chosen so cells come out roughly
   * square, and the remainder is spread one per row so no slot is left empty.
   */
  function rowCounts(count, width, height) {
    let rows = Math.max(1, Math.round(Math.sqrt((count * height) / width)));

    const base = Math.floor(count / rows);
    const extra = count % rows;

  /**
   * Split `total` into `n` uneven parts. `spread` is how far each part may drift
   * from an equal share, so slots — and therefore cells — differ in size.
   */
  function randomSpans(total, n, spread) {
    const weights = [];
    let sum = 0;
    for (let i = 0; i < n; i++) {
      const w = 1 + (Math.random() * 2 - 1) * spread;
      weights.push(w);
      sum += w;
    }
    return weights.map((w) => (w / sum) * total);
  }

  /** Rows of unequal slots, with each seed nudged around inside its own slot. */
  function jitteredGridSeeds(count, width, height, jitter, spread) {
    const counts = rowCounts(count, width, height);
    const rowHeights = randomSpans(height, counts.length, spread);
    const seeds = [];
    let rowTop = 0;

    counts.forEach((cols, row) => {
      const rowHeight = rowHeights[row];
      const colWidths = randomSpans(width, cols, spread);
      let colLeft = 0;

      for (let col = 0; col < cols; col++) {
        const colWidth = colWidths[col];
        const x = colLeft + colWidth * (0.5 + (Math.random() - 0.5) * jitter);
        const y = rowTop + rowHeight * (0.5 + (Math.random() - 0.5) * jitter);
        seeds.push({
          x: Math.max(1, Math.min(width - 1, x)),
          y: Math.max(1, Math.min(height - 1, y)),

   * slivers without collapsing the layout back to an even, obviously regular grid.

    let current = sites.map(cloneSite);

    for (let pass = 0; pass < passes; pass++) {
      const cells = cellsForSites(current, width, height);
      current = cells.map((cell, i) => ({
        x: current[i].x + (cell.centroid.x - current[i].x) * strength,
        y: current[i].y + (cell.centroid.y - current[i].y) * strength,
        index: cell.index,
      }));
    }

  }

  function generateBalancedSites(count, width, height) {
    const JITTER = 0.55;
    const SPREAD = 0.42;
    // Largest piece may be ~2-3.4x the smallest: clearly varied, no slivers.
    const TARGET_MIN = 1.9;
    const TARGET_MAX = 3.4;
    const MAX_ATTEMPTS = 14;
    const midRatio = (TARGET_MIN + TARGET_MAX) / 2;

    let bestSites = null;
    let bestScore = Infinity;

    for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
      const sites = smoothSites(
        jitteredGridSeeds(count, width, height, JITTER, SPREAD),
        width,
        height,
        1,
        0.22
      );
      const ratio = areaBalanceRatio(cellsForSites(sites, width, height));

      if (ratio >= TARGET_MIN && ratio <= TARGET_MAX) return sites;

      const score = Math.abs(ratio - midRatio);
      if (score < bestScore) {

        bestSites = sites;
      }
    }

    return bestSites;
  }

    return normalizedSites.map((s, index) => ({
      x: s.nx * width,
      y: s.ny * height,
      index,
    }));
  }

  function createSiteLayout(count, width, height) {
    const sites = generateBalancedSites(count, width, height);
    return sites.map((s) => ({

      ny: s.y / height,

      return {

        site,
        polygon: padded,
        centroid: polygonCentroid(polygon),

  <script>
    (function () {
      var hud = document.getElementById("hud-layer");
      var overlay = document.getElementById("info-overlay");
      var infoBtn = document.querySelector(".hud-info");
      var closeBtn = document.querySelector(".hud-close");
      if (!hud || !overlay || !infoBtn || !closeBtn) return;

      function isOpen() {
        return !overlay.hidden;
      }

      function openInfo(event) {
        if (event) event.stopPropagation();
        overlay.hidden = false;
        hud.classList.add("is-info-open");
        // next frame so the fade-in transition runs
        requestAnimationFrame(function () {
          overlay.classList.add("is-visible");
        });
      }

      function closeInfo(event) {
        if (!isOpen()) return;
        if (event) event.stopPropagation();
        overlay.classList.remove("is-visible");
        hud.classList.remove("is-info-open");
        setTimeout(function () {
          if (!overlay.classList.contains("is-visible")) overlay.hidden = true;
        }, 250);
      }

      infoBtn.addEventListener("click", openInfo);
      closeBtn.addEventListener("click", closeInfo);
      // taps on the dark layer must not reach the game underneath
      overlay.addEventListener("click", function (e) { e.stopPropagation(); });
      overlay.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeInfo(e);
      });
    })();

      const push = 30 + Math.random() * 45;
      spawnDustPuff(layer, x + Math.cos(ang) * rad, y + Math.sin(ang) * rad, {
        size: 26 + Math.random() * 30,
        delay: Math.random() * 160,
        dx: Math.cos(ang) * push,
        dy: Math.sin(ang) * push - 18,
      });
    }
  }

  /**
   * The stage is laid out at a fixed design size and scaled with a CSS
   * transform to fit the phone screen. getBoundingClientRect() returns the
   * scaled on-screen size, so screen distances are divided by this factor to
   * get back to stage pixels.
   */
  function stageScale() {
    const w = playArea.offsetWidth;
    if (!w) return 1;
    const s = playArea.getBoundingClientRect().width / w;
    return s > 0 ? s : 1;
  }

  function getStageSize() {
    return {
      width: Math.max(1, Math.round(playArea.offsetWidth)),
      height: Math.max(1, Math.round(playArea.offsetHeight)),
    };
  }

  const ICON_SIZE_PX = 84;
  /** Clear space kept between two number plates. */
  const ICON_MIN_GAP_PX = 30;
  /** Matches .cell-icon size + negative margin (anchor = center of plate). */
  const ICON_HALF_W_PX = 42;
  // 54px plate + room for the 20% larger brush icon sticking out above it.
  const ICON_EXTENT_TOP_PX = 62;
  const ICON_EXTENT_BOTTOM_PX = 44;

  /** Bottom edge of the Header.png artwork, in play-area pixels. */
  function headerBottomPx() {
    const header = document.querySelector(".hud-top-wrap");
    if (!header || !playArea) return 0;
    const h = header.getBoundingClientRect();
    if (!h.height) return 0;
    return (h.bottom - playArea.getBoundingClientRect().top) / stageScale();
  }

  /**
   * Area where numbers may sit: the whole picture below the header. Width is
   * not fenced off — pieces at the left and right edges keep their own centre.
   */
  function iconBounds(width, height) {
    // Keep the whole number plate on screen now that the picture fills
    // the screen edge to edge.
    const minX = EDGE_PAD_PX + ICON_HALF_W_PX;
    const maxX = width - EDGE_PAD_PX - ICON_HALF_W_PX;
    // The header and HUD buttons are checked element by element (overlapsHud),
    // so the free corners beside the header stay usable for numbers.
    const minY = EDGE_PAD_PX + ICON_EXTENT_TOP_PX;
    const maxY = height - EDGE_PAD_PX - ICON_EXTENT_BOTTOM_PX;
    return {
      minX,
      maxX: Math.max(minX, maxX),
      minY,
      maxY: Math.max(minY, maxY),
    };
  }

  function clampIconPoint(x, y, width, height) {
    const b = iconBounds(width, height);
    return {
      x: Math.min(b.maxX, Math.max(b.minX, x)),
      y: Math.min(b.maxY, Math.max(b.minY, y)),
    };
  }

  /** Breathing room numbers keep from Sam's silhouette. */
  const SAM_CLEAR_PX = 30;
  /** Opaque bounds of the artwork (normalized) — filled in once measured. */
  let samArtBox = { x0: 0, y0: 0, x1: 1, y1: 1 };

  /** Sam's visible silhouette in play-area pixels (ignores transparent edges). */
  function samRect() {
    if (!samEl || !playArea) return null;
    const s = samEl.getBoundingClientRect();
    if (!s.width || !s.height) return null;
    const pa = playArea.getBoundingClientRect();
    const k = stageScale();
    return {
      x: (s.left - pa.left + s.width * samArtBox.x0) / k,
      y: (s.top - pa.top + s.height * samArtBox.y0) / k,
      w: (s.width * (samArtBox.x1 - samArtBox.x0)) / k,
      h: (s.height * (samArtBox.y1 - samArtBox.y0)) / k,
    };
  }

  /** Sam sits on top of everything, so numbers keep SAM_CLEAR_PX away. */
  function overlapsSam(point) {
    const r = samRect();
    if (!r) return false;
    return (
      point.x + ICON_HALF_W_PX > r.x - SAM_CLEAR_PX &&
      point.x - ICON_HALF_W_PX < r.x + r.w + SAM_CLEAR_PX &&
      point.y + ICON_EXTENT_BOTTOM_PX > r.y - SAM_CLEAR_PX &&
      point.y - ICON_EXTENT_TOP_PX < r.y + r.h + SAM_CLEAR_PX
    );
  }

  /** Header + HUD buttons in stage pixels; measured once per layout. */
  let hudBoxCache = null;

  function hudBoxes() {
    if (hudBoxCache) return hudBoxCache;
    const pa = playArea.getBoundingClientRect();
    const k = stageScale();
    hudBoxCache = Array.from(
      document.querySelectorAll(".hud-top-wrap, .hud-info, .hud-meter, .hud-close, .notch")
    )
      .map((el) => el.getBoundingClientRect())
      .filter((r) => r.width && r.height)
      .map((r) => ({
        x: (r.left - pa.left) / k,
        y: (r.top - pa.top) / k,
        w: r.width / k,
        h: r.height / k,
      }));
    return hudBoxCache;
  }

  /** A number at `point` would touch the header or a HUD button. */
  function overlapsHud(point) {
    const pad = HEADER_CLEARANCE_PX;
    return hudBoxes().some(
      (r) =>
        point.x + ICON_HALF_W_PX > r.x - pad &&
        point.x - ICON_HALF_W_PX < r.x + r.w + pad &&
        point.y + ICON_EXTENT_BOTTOM_PX > r.y - pad &&
        point.y - ICON_EXTENT_TOP_PX < r.y + r.h + pad
    );
  }

  /** Spot is covered by Sam or by the HUD. */
  function blockedSpot(point) {
    return overlapsSam(point) || overlapsHud(point);
  }

  /**
   * Slide the artwork left until the silhouette touches the picture edge.
   * Expressed in percent of Sam's own width, so it survives any relayout.
   */
  function applySamShift() {
    if (!samEl) return;
    samEl.style.setProperty("--sam-shift", `${(-samArtBox.x0 * 100).toFixed(3)}%`);
  }

  /**
   * Both poses are measured for opaque pixels; the union drives the exclusion
   * zone and the smaller left padding drives the shift, so neither gets cropped.
   */
  function measureSamArt() {
    if (!samEl) return;
    const sources = ["assets/sam-sad.png", "assets/sam-happy.png"];
    const jobs = sources.map(
      (src) =>
        new Promise((resolve) => {
          const img = new Image();
          img.onerror = () => resolve(null);
          img.onload = () => {
            const w = 200;
            const h = Math.max(
              1,
              Math.round((200 * img.naturalHeight) / img.naturalWidth)
            );
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, w, h);
            const data = ctx.getImageData(0, 0, w, h).data;
            let x0 = w;
            let y0 = h;
            let x1 = 0;
            let y1 = 0;
            let found = false;
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                if (data[(y * w + x) * 4 + 3] <= 12) continue;
                found = true;
                if (x < x0) x0 = x;
                if (x > x1) x1 = x;
                if (y < y0) y0 = y;
                if (y > y1) y1 = y;
              }
            }
            resolve(
              found
                ? { x0: x0 / w, y0: y0 / h, x1: (x1 + 1) / w, y1: (y1 + 1) / h }
                : null
            );
          };
          img.src = src;
        })
    );

    return Promise.all(jobs).then((boxes) => {
      const found = boxes.filter(Boolean);
      if (!found.length) return;
      samArtBox = {
        x0: Math.min(...found.map((b) => b.x0)),
        y0: Math.min(...found.map((b) => b.y0)),
        x1: Math.max(...found.map((b) => b.x1)),
        y1: Math.max(...found.map((b) => b.y1)),
      };
      applySamShift();
      // Numbers were laid out against a wider box — redo it while nothing is cleared.
      if (clearedCount === 0) {
        layoutWidth = 0;
        layoutHeight = 0;
        buildScene();
      }
    });
  }

  /**
   * Eight brush icons on Peggy's face only (normalized 0–1 in the scene art).
   * Cheeks, snout and chin — not the ears, and not the room around her.
   */
  const FACE_ART_SPOTS = [
    { u: 0.307, v: 0.501 },
    { u: 0.492, v: 0.501 },
    { u: 0.677, v: 0.501 },
    { u: 0.285, v: 0.695 },
    { u: 0.492, v: 0.695 },
    { u: 0.700, v: 0.695 },
    { u: 0.384, v: 0.856 },
    { u: 0.600, v: 0.856 },
  ];

  /** Scene art pixel → stage pixel, matching drawImageCover (xMidYMid slice). */
  function artSpotToStage(u, v, width, height) {
    const iw = stateAImage.naturalWidth || 2573;
    const ih = stateAImage.naturalHeight || 1228;
    const scale = Math.max(width / iw, height / ih);
    const sx = (iw - width / scale) * 0.5;
    const sy = (ih - height / scale) * 0.5;
    return {
      x: (u * iw - sx) * scale,
      y: (v * ih - sy) * scale,
    };
  }

  /** The tap icons, in stage pixels, all inside the face. */
  function faceIconSpots(width, height) {
    return FACE_ART_SPOTS.map((s) => artSpotToStage(s.u, s.v, width, height));
  }

  /** Sites sit on the face so each numbered brush is on Peggy, not the room. */
  function createSpreadSiteLayout(count, width, height) {
    const spots = faceIconSpots(width, height).slice(0, count);
    while (spots.length < count) spots.push(spots[spots.length - 1]);
    return spots.map((p) => ({ nx: p.x / width, ny: p.y / height }));
  }

  /** Gap between a number at `p` and the closest already-placed one. */
  function iconSeparation(p, placed) {
    let worst = Infinity;
    for (const o of placed) {
      const gapX = Math.abs(p.x - o.x) - ICON_SIZE_PX;
      const gapY =
        Math.abs(p.y - o.y) - (ICON_EXTENT_TOP_PX + ICON_EXTENT_BOTTOM_PX);
      worst = Math.min(worst, Math.max(gapX, gapY));
    }
    return worst;
  }

  function iconSpotFree(p, placed, gap) {
    return iconSeparation(p, placed) >= (gap === undefined ? ICON_MIN_GAP_PX : gap);
  }

  function closestTo(anchor, points) {
    let best = null;
    let bestDist = Infinity;
    for (const p of points) {
      const d = Math.hypot(p.x - anchor.x, p.y - anchor.y);
      if (d < bestDist) {
        bestDist = d;
        best = p;
      }
    }
    return best;
  }

  function distanceToSegment(p, a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const lenSq = dx * dx + dy * dy;
    const t =
      lenSq > 0
        ? Math.max(
            0,
            Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq)
          )
        : 0;
    return Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t));
  }

  function distanceToPolygonEdge(p, polygon) {
    let best = Infinity;
    for (let i = 0; i < polygon.length; i++) {
      const a = polygon[i];
      const b = polygon[(i + 1) % polygon.length];
      best = Math.min(best, distanceToSegment(p, a, b));
    }
    return best;
  }

  function distanceOutsideRect(p, r) {
    const dx = Math.max(r.x - p.x, p.x - (r.x + r.w), 0);
    const dy = Math.max(r.y - p.y, p.y - (r.y + r.h), 0);
    return Math.hypot(dx, dy);
  }

  /** How much room a spot has before it hits the piece rim, Sam or the frame. */
  function clearanceAt(p, cell, b) {
    let room = Math.min(
      distanceToPolygonEdge(p, cell.polygon),
      p.x - b.minX,
      b.maxX - p.x,
      p.y - b.minY,
      b.maxY - p.y
    );
    const sam = samRect();
    if (sam) {
      room = Math.min(
        room,
        distanceOutsideRect(p, {
          x: sam.x - SAM_CLEAR_PX - ICON_HALF_W_PX,
          y: sam.y - SAM_CLEAR_PX - ICON_EXTENT_BOTTOM_PX,
          w: sam.w + (SAM_CLEAR_PX + ICON_HALF_W_PX) * 2,
          h: sam.h + SAM_CLEAR_PX * 2 + ICON_EXTENT_TOP_PX + ICON_EXTENT_BOTTOM_PX,
        })
      );
    }
    return room;
  }

  /**
   * Middle of the part of a piece a number may use. Spots that clear their
   * neighbours always win; among those, the one furthest from the piece rim
   * and from Sam reads as the centre of what is left of the piece.
   */
  function mostCentralSpot(points, cell, b, placed) {
    let best = null;
    let bestScore = -Infinity;
    for (const p of points) {
      const score =
        clearanceAt(p, cell, b) + (iconSpotFree(p, placed) ? 1e4 : 0);
      if (score > bestScore) {
        bestScore = score;
        best = p;
      }
    }
    return best;
  }

  /** Re-sample around a coarse pick, since the grid step is tens of pixels. */
  function refineCentralSpot(pick, cell, b, placed, step) {
    let best = pick;
    for (let ring = step / 2; ring >= 4; ring /= 2) {
      const around = [best];
      for (let iy = -1; iy <= 1; iy++) {
        for (let ix = -1; ix <= 1; ix++) {
          if (!ix && !iy) continue;
          const p = { x: best.x + ix * ring, y: best.y + iy * ring };
          if (!inIconBounds(p, b)) continue;
          if (blockedSpot(p)) continue;
          if (!pointInPolygon(p, cell.polygon)) continue;
          around.push(p);
        }
      }
      best = mostCentralSpot(around, cell, b, placed) || best;
    }
    return best;
  }

  function inIconBounds(p, b) {
    return p.x >= b.minX && p.x <= b.maxX && p.y >= b.minY && p.y <= b.maxY;
  }

  /** Sutherland-Hodgman clip against one edge of the picture. */
  function clipHalfPlane(polygon, keep, cross) {
    const out = [];
    for (let i = 0; i < polygon.length; i++) {
      const cur = polygon[i];
      const prev = polygon[(i + polygon.length - 1) % polygon.length];
      const curIn = keep(cur);
      const prevIn = keep(prev);
      if (curIn) {
        if (!prevIn) out.push(cross(prev, cur));
        out.push(cur);
      } else if (prevIn) {
        out.push(cross(prev, cur));
      }
    }
    return out;
  }

  function clipPolygonToRect(polygon, x0, y0, x1, y1) {
    const atX = (a, b, x) => ({
      x,
      y: a.y + ((b.y - a.y) * (x - a.x)) / (b.x - a.x || 1e-6),
    });
    const atY = (a, b, y) => ({
      x: a.x + ((b.x - a.x) * (y - a.y)) / (b.y - a.y || 1e-6),
      y,
    });
    let out = polygon;
    out = clipHalfPlane(out, (p) => p.x >= x0, (a, b) => atX(a, b, x0));
    out = clipHalfPlane(out, (p) => p.x <= x1, (a, b) => atX(a, b, x1));
    out = clipHalfPlane(out, (p) => p.y >= y0, (a, b) => atY(a, b, y0));
    out = clipHalfPlane(out, (p) => p.y <= y1, (a, b) => atY(a, b, y1));
    return out;
  }

  function polygonCentroid(polygon) {
    let twiceArea = 0;
    let cx = 0;
    let cy = 0;
    for (let i = 0; i < polygon.length; i++) {
      const p = polygon[i];
      const q = polygon[(i + 1) % polygon.length];
      const cross = p.x * q.y - q.x * p.y;
      twiceArea += cross;
      cx += (p.x + q.x) * cross;
      cy += (p.y + q.y) * cross;
    }
    if (Math.abs(twiceArea) < 1e-6) return null;
    return { x: cx / (3 * twiceArea), y: cy / (3 * twiceArea) };
  }

  /**
   * The part of a piece a number can actually sit on: pieces bleed past the
   * picture and run under the header, and those parts must not pull the number
   * off the visible middle of the piece.
   */
  function visiblePart(cell, width, height) {
    const top = headerBottomPx() + HEADER_CLEARANCE_PX;
    const clipped = clipPolygonToRect(cell.polygon, 0, top, width, height);
    return clipped.length >= 3 ? clipped : cell.polygon;
  }

  /** Spots inside one piece that are on the picture, below the header, off Sam. */
  function cellCandidates(cell, width, height) {
    const b = iconBounds(width, height);
    const bbox = polygonBBox(visiblePart(cell, width, height));
    const steps = 18;
    const spots = [];
    for (let iy = 0; iy <= steps; iy++) {
      for (let ix = 0; ix <= steps; ix++) {
        const p = {
          x: bbox.minX + (bbox.width * ix) / steps,
          y: bbox.minY + (bbox.height * iy) / steps,
        };
        if (!inIconBounds(p, b)) continue;
        if (blockedSpot(p)) continue;
        if (!pointInPolygon(p, cell.polygon)) continue;
        spots.push(p);
      }
    }
    return spots;
  }

  /** Nearest free spot anywhere on the picture, for pieces that have none. */
  function freeSpotNear(anchor, width, height, placed, gap) {
    const b = iconBounds(width, height);
    const step = 12;
    const spots = [];
    for (let y = b.minY; y <= b.maxY; y += step) {
      for (let x = b.minX; x <= b.maxX; x += step) {
        const p = { x, y };
        if (blockedSpot(p)) continue;
        if (!iconSpotFree(p, placed, gap)) continue;
        spots.push(p);
      }
    }
    return closestTo(anchor, spots);
  }

  /**
   * Where a piece's number sits: the centre of that piece, unless Sam, the
   * header or the picture edge takes that spot — then the centre of whatever
   * of the piece is left.
   */
  function iconPointForCell(cell, width, height, placed) {
    const b = iconBounds(width, height);
    const middle =
      polygonCentroid(visiblePart(cell, width, height)) ||
      cell.centroid ||
      cell.site;
    const centre = clampIconPoint(middle.x, middle.y, width, height);
    const centreUsable =
      !blockedSpot(centre) && pointInPolygon(centre, cell.polygon);

    if (centreUsable && iconSpotFree(centre, placed)) return centre;

    const inside = cellCandidates(cell, width, height);

    // Only a neighbour is in the way: step off the centre as little as possible.
    if (centreUsable) {
      const free = inside.filter((p) => iconSpotFree(p, placed));
      if (free.length) return closestTo(centre, free);
    }

    let insidePick = null;
    if (inside.length) {
      const bbox = polygonBBox(visiblePart(cell, width, height));
      const step = Math.max(bbox.width, bbox.height) / 18;
      insidePick = refineCentralSpot(
        mostCentralSpot(inside, cell, b, placed),
        cell,
        b,
        placed,
        step
      );
      if (iconSpotFree(insidePick, placed)) return insidePick;
    }

    // No free spot inside the piece (or Sam / the header covers it):
    // take the nearest free spot to the piece centre so numbers never overlap.
    const anchor = insidePick || centre;
    // If the picture is crowded, accept a smaller gap rather than an overlap
    // (gap 0 = plates just touch, never overlap).
    for (const gap of [ICON_MIN_GAP_PX, 20, 12, 6, 0]) {
      const outside = freeSpotNear(anchor, width, height, placed, gap);
      if (outside) return outside;
    }
    return insidePick || pushOutOfSam(centre, width, height);
  }

  /** Nearest spot beside or above Sam, so a number is never hidden by him. */
  function pushOutOfSam(point, width, height) {
    if (!overlapsSam(point)) return point;
    const r = samRect();
    const b = iconBounds(width, height);
    const beside = {
      x: Math.min(b.maxX, r.x + r.w + SAM_CLEAR_PX + ICON_HALF_W_PX),
      y: point.y,
    };
    const above = {
      x: point.x,
      y: Math.max(b.minY, r.y - SAM_CLEAR_PX - ICON_EXTENT_BOTTOM_PX),
    };
    const clear = [beside, above].filter((p) => !overlapsSam(p));
    if (!clear.length) return { x: beside.x, y: above.y };

    clear.sort(
      (p, q) =>
        Math.hypot(p.x - point.x, p.y - point.y) -
        Math.hypot(q.x - point.x, q.y - point.y)
    );
    return clear[0];
  }

  /** Draw like CSS object-fit: cover — fill the scene, crop overflow. */
  function drawImageCover(ctx, img, dx, dy, dw, dh) {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if (!iw || !ih || !dw || !dh) return;
    const scale = Math.max(dw / iw, dh / ih);
    const sw = dw / scale;
    const sh = dh / scale;
    const sx = (iw - sw) * 0.5;
    const sy = (ih - sh) * 0.5;
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  }

  function polygonBBox(polygon) {
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    for (const p of polygon) {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    }
    return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
  }

  function clearLayers() {
    svgLayer.innerHTML = "";
    iconsLayer.innerHTML = "";
    vfxLayer.innerHTML = "";
    cellPolygons.clear();
    cellIconSpots.clear();
    clearedDustMasks.length = 0;
    if (dustCanvas) {
      dustCanvas.remove();
      dustCanvas = null;
      dustCtx = null;
    }
    dustBase = null;
  }

  function ensureDustLayer(width, height) {
    // Dirt / dust overlay removed.
    if (dustCanvas) {
      dustCanvas.remove();
      dustCanvas = null;
      dustCtx = null;
    }
    dustBase = null;
  }

  function mulberry32(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6d2b79f5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function paintDustAndWebs(ctx, width, height) {
    ctx.clearRect(0, 0, width, height);
    const rnd = mulberry32(91 + pieceCount * 13);
    const minSide = Math.min(width, height);

    const haze = ctx.createRadialGradient(
      width * 0.45,
      height * 0.35,
      minSide * 0.1,
      width * 0.5,
      height * 0.5,
      minSide * 0.85
    );
    haze.addColorStop(0, "rgba(185, 170, 145, 0.14)");
    haze.addColorStop(0.45, "rgba(140, 125, 100, 0.22)");
    haze.addColorStop(1, "rgba(75, 62, 48, 0.34)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 3; i++) {
      const wx = width * (0.12 + i * 0.28);
      const shaft = ctx.createLinearGradient(wx, 0, wx + width * 0.08, height);
      shaft.addColorStop(0, "rgba(210, 200, 175, 0.1)");
      shaft.addColorStop(0.55, "rgba(180, 165, 140, 0.04)");
      shaft.addColorStop(1, "rgba(180, 165, 140, 0)");
      ctx.fillStyle = shaft;
      ctx.beginPath();
      ctx.moveTo(wx - 20, 0);
      ctx.lineTo(wx + width * 0.1, 0);
      ctx.lineTo(wx + width * 0.18, height);
      ctx.lineTo(wx - width * 0.02, height);
      ctx.closePath();
      ctx.fill();
    }

    for (let i = 0; i < 90; i++) {
      const x = rnd() * width;
      const y = rnd() * height;
      const r = 20 + rnd() * 75;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const a = 0.05 + rnd() * 0.12;
      g.addColorStop(0, "rgba(165, 148, 120, " + a + ")");
      g.addColorStop(1, "rgba(165, 148, 120, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = 0; i < Math.floor(width * height * 0.0014); i++) {
      const x = rnd() * width;
      const y = rnd() * height;
      ctx.fillStyle = "rgba(220, 205, 175, " + (0.12 + rnd() * 0.28) + ")";
      const s = 0.7 + rnd() * 1.8;
      ctx.fillRect(x, y, s, s * (0.4 + rnd() * 0.9));
    }
  }

  /**
   * Redraw dust from the pristine base, then punch holes for cleaned areas.
   * Optional live wipe hole: soft cell ∩ cleared part of wipe matte.
   */
  function redrawDust(liveSoft, liveKeepMatte, brushRect) {
    if (!dustCtx || !dustBase) return;
    const w = dustCanvas.width;
    const h = dustCanvas.height;
    dustCtx.setTransform(1, 0, 0, 1, 0, 0);
    dustCtx.globalCompositeOperation = "source-over";
    dustCtx.globalAlpha = 1;
    dustCtx.clearRect(0, 0, w, h);
    dustCtx.drawImage(dustBase, 0, 0);

    dustCtx.globalCompositeOperation = "destination-out";
    clearedDustMasks.forEach((mask) => {
      dustCtx.drawImage(mask, 0, 0);
    });

    if (liveSoft && liveKeepMatte && brushRect) {
      const hole = document.createElement("canvas");
      hole.width = w;
      hole.height = h;
      const hctx = hole.getContext("2d");
      // White where wipe has already cleared inside the brush footprint.
      hctx.fillStyle = "#fff";
      hctx.fillRect(brushRect.x, brushRect.y, brushRect.w, brushRect.h);
      hctx.globalCompositeOperation = "destination-out";
      hctx.drawImage(
        liveKeepMatte,
        brushRect.x,
        brushRect.y,
        brushRect.w,
        brushRect.h
      );
      // Limit to the soft cell silhouette.
      hctx.globalCompositeOperation = "destination-in";
      hctx.drawImage(liveSoft, 0, 0);
      dustCtx.drawImage(hole, 0, 0);
    } else if (liveSoft) {
      dustCtx.drawImage(liveSoft, 0, 0);
    }

    dustCtx.globalCompositeOperation = "source-over";
  }

  function commitDustHole(softMask) {
    if (!softMask) return;
    clearedDustMasks.push(softMask);
    redrawDust();
  }

  /**
   * Warps a shape's outline into a smooth wavy line. Both noise fields are
   * functions of stage position only, so two pieces sharing a border get warped
   * identically and their borders stay glued together.
   */
  function buildEdgeWarpFilter(id, width, height, warp) {
    const filter = document.createElementNS(SVG_NS, "filter");
    filter.setAttribute("id", id);
    filter.setAttribute("filterUnits", "userSpaceOnUse");
    filter.setAttribute("x", String(-EDGE_PAD));
    filter.setAttribute("y", String(-EDGE_PAD));
    filter.setAttribute("width", String(width + EDGE_PAD * 2));
    filter.setAttribute("height", String(height + EDGE_PAD * 2));

    const swellNoise = document.createElementNS(SVG_NS, "feTurbulence");
    swellNoise.setAttribute("type", "fractalNoise");
    swellNoise.setAttribute("baseFrequency", warp.frequency.toFixed(5));
    swellNoise.setAttribute("numOctaves", "2");
    swellNoise.setAttribute("seed", "7");
    swellNoise.setAttribute("result", "swellNoise");

    const swell = document.createElementNS(SVG_NS, "feDisplacementMap");
    swell.setAttribute("in", "SourceGraphic");
    swell.setAttribute("in2", "swellNoise");
    swell.setAttribute("scale", String(warp.swell));
    swell.setAttribute("xChannelSelector", "R");
    swell.setAttribute("yChannelSelector", "G");
    swell.setAttribute("result", "swelled");

    const rippleNoise = document.createElementNS(SVG_NS, "feTurbulence");
    rippleNoise.setAttribute("type", "fractalNoise");
    rippleNoise.setAttribute("baseFrequency", (warp.frequency * 3.2).toFixed(5));
    rippleNoise.setAttribute("numOctaves", "2");
    rippleNoise.setAttribute("seed", "23");
    rippleNoise.setAttribute("result", "rippleNoise");

    const crinkle = document.createElementNS(SVG_NS, "feDisplacementMap");
    crinkle.setAttribute("in", "swelled");
    crinkle.setAttribute("in2", "rippleNoise");
    crinkle.setAttribute("scale", String(warp.ripple));
    crinkle.setAttribute("xChannelSelector", "R");
    crinkle.setAttribute("yChannelSelector", "G");
    crinkle.setAttribute("result", "crinkled");

    const blur = document.createElementNS(SVG_NS, "feGaussianBlur");
    blur.setAttribute("in", "crinkled");
    blur.setAttribute("stdDeviation", String(EDGE_FADE));

    filter.appendChild(swellNoise);
    filter.appendChild(swell);
    filter.appendChild(rippleNoise);
    filter.appendChild(crinkle);
    filter.appendChild(blur);

    return filter;
  }

  function edgeWarpSettings(width, height) {
    const cellSize = Math.sqrt((width * height) / pieceCount);
    return {
      swell: Math.min(72, Math.max(28, cellSize * 0.3)),
      ripple: Math.min(22, Math.max(9, cellSize * 0.09)),
      frequency: 1.35 / cellSize,
    };
  }

  function appendSharedDefs(defs, width, height) {
    const warp = edgeWarpSettings(width, height);
    defs.appendChild(buildEdgeWarpFilter("cell-edge", width, height, warp));
  }

  /** Smooth value-noise in stage space so shared borders displace identically. */
  function edgeField(x, y) {
    return (
      Math.sin(x * 0.028 + y * 0.023) * 0.5 +
      Math.sin(x * 0.051 - y * 0.037) * 0.32 +
      Math.sin(x * 0.013 + y * 0.061) * 0.18
    );
  }

  function edgeField2(x, y) {
    return (
      Math.sin(x * 0.033 - y * 0.019) * 0.5 +
      Math.sin(x * 0.017 + y * 0.044) * 0.35 +
      Math.sin(x * 0.058 + y * 0.011) * 0.15
    );
  }

  /**
   * Densify polygon edges, wave them with stage-space noise (no straight runs),
   * then emit a Catmull-Rom-smoothed path. Neighbours stay sealed because the
   * displacement depends only on absolute position.
   */
  function organicCellPath(polygon, cornerRadius, waveAmp) {
    const rounded = densifyRoundedPolygon(polygon, cornerRadius, EDGE_STEP);
    if (rounded.length < 3) return "";

    const waved = rounded.map((p) => ({
      x: p.x + edgeField(p.x, p.y) * waveAmp,
      y: p.y + edgeField2(p.x, p.y) * waveAmp,
    }));

    return catmullRomPath(waved);
  }

  function densifyRoundedPolygon(polygon, radius, step) {
    const n = polygon.length;
    if (n < 3) return polygon.slice();

    const corners = [];
    for (let i = 0; i < n; i++) {
      const prev = polygon[(i + n - 1) % n];
      const curr = polygon[i];
      const next = polygon[(i + 1) % n];

      const inLen = Math.hypot(curr.x - prev.x, curr.y - prev.y) || 1;
      const outLen = Math.hypot(next.x - curr.x, next.y - curr.y) || 1;
      const rIn = Math.min(radius, inLen * 0.42);
      const rOut = Math.min(radius, outLen * 0.42);

      const start = {
        x: curr.x - ((curr.x - prev.x) / inLen) * rIn,
        y: curr.y - ((curr.y - prev.y) / inLen) * rIn,
      };
      const end = {
        x: curr.x + ((next.x - curr.x) / outLen) * rOut,
        y: curr.y + ((next.y - curr.y) / outLen) * rOut,
      };

      // Approximate the corner curve with a few samples so it is not a hard tip.
      corners.push(start);
      for (let t = 1; t <= 3; t++) {
        const u = t / 4;
        const omu = 1 - u;
        corners.push({
          x: omu * omu * start.x + 2 * omu * u * curr.x + u * u * end.x,
          y: omu * omu * start.y + 2 * omu * u * curr.y + u * u * end.y,
        });
      }
      corners.push(end);
    }

    const dense = [];
    for (let i = 0; i < corners.length; i++) {
      const a = corners[i];
      const b = corners[(i + 1) % corners.length];
      dense.push(a);
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const segs = Math.max(1, Math.ceil(len / step));
      for (let s = 1; s < segs; s++) {
        const t = s / segs;
        dense.push({
          x: a.x + (b.x - a.x) * t,
          y: a.y + (b.y - a.y) * t,
        });
      }
    }
    return dense;
  }

  function catmullRomPath(points) {
    const n = points.length;
    if (n < 2) return "";
    let d = `M ${fmt(points[0])}`;
    for (let i = 0; i < n; i++) {
      const p0 = points[(i - 1 + n) % n];
      const p1 = points[i];
      const p2 = points[(i + 1) % n];
      const p3 = points[(i + 2) % n];
      const c1 = {
        x: p1.x + (p2.x - p0.x) / 6,
        y: p1.y + (p2.y - p0.y) / 6,
      };
      const c2 = {
        x: p2.x - (p3.x - p1.x) / 6,
        y: p2.y - (p3.y - p1.y) / 6,
      };
      d += ` C ${fmt(c1)} ${fmt(c2)} ${fmt(p2)}`;
    }
    return `${d} Z`;
  }

  function fmt(p) {
    return `${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
  }

  function edgeOutlinePath(cell) {
    return organicCellPath(
      VoronoiReveal.expandPolygon(cell.polygon, FEATHER),
      CORNER_RADIUS,
      EDGE_WAVE
    );
  }

  function createEdgeMask(defs, cell, width, height) {
    const mask = document.createElementNS(SVG_NS, "mask");
    mask.setAttribute("id", `cell-edge-mask-${cell.index}`);
    mask.setAttribute("maskUnits", "userSpaceOnUse");
    mask.setAttribute("x", String(-EDGE_PAD));
    mask.setAttribute("y", String(-EDGE_PAD));
    mask.setAttribute("width", String(width + EDGE_PAD * 2));
    mask.setAttribute("height", String(height + EDGE_PAD * 2));

    const outline = document.createElementNS(SVG_NS, "path");
    outline.setAttribute("d", edgeOutlinePath(cell));
    outline.setAttribute("fill", "#fff");
    outline.setAttribute("filter", "url(#cell-edge)");
    mask.appendChild(outline);
    defs.appendChild(mask);
  }

  function buildScene() {
    const { width, height } = getStageSize();
    if (width === layoutWidth && height === layoutHeight && svgLayer.childElementCount > 0) {
      return;
    }
    layoutWidth = width;
    layoutHeight = height;
    hudBoxCache = null;

    clearedCount = 0;
    stopCelebrationLights(true);
    setSamHappy(false);
    applySamShift();
    const budget = budgetForPieceCount(pieceCount);
    currency = budget;
    setCurrencyDisplay(budget, true);
    rewardScreen.hidden = true;
    rewardScreen.classList.remove("is-visible");

    clearLayers();

    svgLayer.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svgLayer.setAttribute("preserveAspectRatio", "xMidYMid slice");

    const defs = document.createElementNS(SVG_NS, "defs");
    svgLayer.appendChild(defs);
    appendSharedDefs(defs, width, height);

    const piecesRoot = document.createElementNS(SVG_NS, "g");
    piecesRoot.classList.add("pieces-layer");
    svgLayer.appendChild(piecesRoot);

    const faceSpots = faceIconSpots(width, height);
    if (!siteLayout) {
      siteLayout = createSpreadSiteLayout(pieceCount, width, height);
    }
    const cells = VoronoiReveal.computeVoronoi(
      pieceCount,
      width,
      height,
      siteLayout,
      -EDGE_BLEED_PX
    );
    const cellCosts = costsFromCellAreas(cells);

    // Small pieces have the least room, so they pick their number spot first;
    // every later number must keep clear of all the ones already placed.
    const iconSpots = [];
    const spotByCell = new Map();
    cells
      .slice()
      .sort(
        (a, c) =>
          VoronoiReveal.polygonArea(visiblePart(a, width, height)) -
          VoronoiReveal.polygonArea(visiblePart(c, width, height))
      )
      .forEach((cell) => {
        // The number stays on the face spot. Cell centroids sit outside the
        // face because each piece also covers the room around Peggy.
        const spot = faceSpots[cell.index] || iconPointForCell(cell, width, height, iconSpots);
        iconSpots.push(spot);
        spotByCell.set(cell.index, spot);
      });

    cells.forEach((cell) => {
      cellPolygons.set(cell.index, cell.polygon);
      createEdgeMask(defs, cell, width, height);

      const group = document.createElementNS(SVG_NS, "g");
      group.classList.add("cell");
      group.dataset.cellId = String(cell.index);

      const image = document.createElementNS(SVG_NS, "image");
      image.setAttributeNS(XLINK_NS, "href", stateAUrl);
      image.setAttribute("href", stateAUrl);
      image.setAttribute("x", "0");
      image.setAttribute("y", "0");
      image.setAttribute("width", String(width));
      image.setAttribute("height", String(height));
      image.setAttribute("preserveAspectRatio", "xMidYMid slice");
      image.setAttribute("mask", `url(#cell-edge-mask-${cell.index})`);

      group.appendChild(image);
      piecesRoot.appendChild(group);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cell-icon";
      btn.dataset.cellId = String(cell.index);
      const spot = spotByCell.get(cell.index);
      cellIconSpots.set(cell.index, spot);
      btn.style.left = `${spot.x}px`;
      btn.style.top = `${spot.y}px`;
      btn.setAttribute("aria-label", `Reveal piece ${cell.index + 1}`);

      const plate = document.createElement("span");
      plate.className = "cell-icon-plate";
      btn.appendChild(plate);

      const iconImg = document.createElement("img");
      iconImg.className = "cell-icon-sku";
      iconImg.src = iconUrl;
      iconImg.alt = "";
      iconImg.draggable = false;
      btn.appendChild(iconImg);

      const cost = cellCosts[cell.index];
      const iconLabel = document.createElement("span");
      iconLabel.className = "cell-icon-label";
      iconLabel.textContent = String(cost);
      btn.dataset.cost = String(cost);
      btn.appendChild(iconLabel);

      btn.addEventListener("click", (event) => onIconTap(cell.index, event));
      iconsLayer.appendChild(btn);
    });

    // Dust/dirt overlay disabled.
    // ensureDustLayer(width, height);
