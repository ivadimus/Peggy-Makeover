    // A fresh set of pieces: start counting idle time.
    resetHintTimer();
  }

  /** Map Voronoi piece areas to integer costs — larger piece → higher cost. */
  /** The cheapest a piece can be: every number on a piece starts at 5 or more. */
  const MIN_PIECE_COST = 5;

  function costsFromCellAreas(cells) {
    const budget = budgetForPieceCount(pieceCount);
    const n = cells.length;
    // If the budget were ever too small for the minimum, fall back to a lower floor.
    const floor = Math.max(1, Math.min(MIN_PIECE_COST, Math.floor(budget / n)));
    const areas = cells.map((cell) =>
      Math.max(1, VoronoiReveal.polygonArea(cell.polygon))
    );
    const total = areas.reduce((sum, a) => sum + a, 0);
    // Every piece gets the minimum; the rest of the budget is shared out by area.
    const spare = budget - floor * n;
    const raw = areas.map((a) => floor + (a / total) * spare);
    const costs = raw.map((v) => Math.max(floor, Math.round(v)));

    // Fix rounding so costs sum to the mode budget (never dropping below the minimum).
    let diff = budget - costs.reduce((sum, c) => sum + c, 0);
    const order = areas
      .map((a, i) => ({ a, i }))
      .sort((x, y) => y.a - x.a);
    let guard = 0;
    while (diff !== 0 && guard < 5000) {
      const idx = order[guard % order.length].i;
      if (diff > 0) {
        costs[idx] += 1;
        diff -= 1;
      } else if (costs[idx] > floor) {
        costs[idx] -= 1;
        diff += 1;
      }
      guard += 1;
    }
    return costs;
  }

  /**
   * Soft cell silhouette matching the SVG edge masks (feather + blur),
   * so the wipe never flashes hard polygon edges.
   */
  function buildSoftCellMask(width, height, polygon) {
    const soft = document.createElement("canvas");
    soft.width = width;
    soft.height = height;
    const sctx = soft.getContext("2d");

    const outline = organicCellPath(
      VoronoiReveal.expandPolygon(polygon, FEATHER),
      CORNER_RADIUS,
      EDGE_WAVE
    );
    const path = new Path2D(outline);

    sctx.filter = `blur(${EDGE_FADE}px)`;
    sctx.fillStyle = "#fff";
    sctx.fill(path);
    sctx.filter = "none";

    return soft;
  }

  function pointInPolygon(point, polygon) {
    let inside = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const a = polygon[i];
      const b = polygon[j];
      const intersects =
        a.y > point.y !== b.y > point.y &&
        point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x;
      if (intersects) inside = !inside;
    }
    return inside;
  }

  function randomPointInPolygon(polygon) {
    const bbox = polygonBBox(polygon);
    for (let i = 0; i < 24; i++) {
      const candidate = {
        x: bbox.minX + Math.random() * bbox.width,
        y: bbox.minY + Math.random() * bbox.height,
      };
      if (pointInPolygon(candidate, polygon)) return candidate;
    }
    return {
      x: (bbox.minX + bbox.maxX) / 2,
      y: (bbox.minY + bbox.maxY) / 2,
    };
  }

  /**
   * Soft powder footprint. Alpha falls off early and is blurred again so the
   * cleaned patch melts into the dirty layer instead of a hard wipe edge.
   */
  function buildSpongeStamp(radius) {
    const size = Math.max(8, Math.ceil(radius * 2));
    const src = document.createElement("canvas");
    src.width = size;
    src.height = size;
    const sctx = src.getContext("2d");
    const c = size / 2;

    const grad = sctx.createRadialGradient(c, c, radius * 0.02, c, c, radius);
    grad.addColorStop(0, "rgba(255,255,255,1)");
    grad.addColorStop(0.2, "rgba(255,255,255,0.72)");
    grad.addColorStop(0.46, "rgba(255,255,255,0.34)");
    grad.addColorStop(0.7, "rgba(255,255,255,0.1)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, size, size);

    const stamp = document.createElement("canvas");
    stamp.width = size;
    stamp.height = size;
    const out = stamp.getContext("2d");
    out.filter = `blur(${Math.max(6, radius * 0.32)}px)`;
    out.drawImage(src, 0, 0);
    out.filter = "none";
    return stamp;
  }

  /** Left/right edge of the piece along the horizontal line at y. */
  function polygonSpanAtY(polygon, y) {
    let lo = Infinity;
    let hi = -Infinity;
    for (let i = 0; i < polygon.length; i++) {
      const p0 = polygon[i];
      const p1 = polygon[(i + 1) % polygon.length];
      if ((p0.y <= y && p1.y > y) || (p1.y <= y && p0.y > y)) {
        const x = p0.x + ((y - p0.y) / (p1.y - p0.y)) * (p1.x - p0.x);
        lo = Math.min(lo, x);
        hi = Math.max(hi, x);
      }
    }
    return lo <= hi ? { lo, hi } : null;
  }

  /** Number of side-to-side sweeps so the brush trail covers the local area. */
  function brushSweeps(area, stampRadius) {
    const n = Math.round(area.height / (stampRadius * 1.3));
    return Math.min(BRUSH_MAX_SWEEPS, Math.max(BRUSH_MIN_SWEEPS, n));
  }

  /** Header.png box in play-area pixels (null if not on screen). */
  function headerRectPx() {
    const header = document.querySelector(".hud-top-wrap");
    if (!header || !playArea) return null;
    const h = header.getBoundingClientRect();
    if (!h.width || !h.height) return null;
    const pa = playArea.getBoundingClientRect();
    const k = stageScale();
    return {
      x: (h.left - pa.left) / k,
      y: (h.top - pa.top) / k,
      w: h.width / k,
      h: h.height / k,
    };
  }

  /** Gap kept between the bottom of Header.png and the top of the brush. */
  // (a little extra room so the tilted brush corner never slips under it)
  const BRUSH_HEADER_GAP_PX = 16;

  /**
   * Square of BRUSH_AREA_PX around the number, trimmed to the piece, where
   * the brush actually sweeps.
   */
  function localBrushArea(polygon, bbox, centre) {
    const half = BRUSH_AREA_PX / 2;
    const c = centre || { x: (bbox.minX + bbox.maxX) / 2, y: (bbox.minY + bbox.maxY) / 2 };
    const minX = Math.max(bbox.minX, c.x - half);
    const maxX = Math.min(bbox.maxX, c.x + half);
    const minY = Math.max(bbox.minY, c.y - half);
    const maxY = Math.min(bbox.maxY, c.y + half);
    return {
      minX,
      maxX: Math.max(minX + 1, maxX),
      minY,
      maxY: Math.max(minY + 1, maxY),
      width: Math.max(1, maxX - minX),
      height: Math.max(1, maxY - minY),
    };
  }

  /** Left/right limits of the sweep at height y, inside the piece and the area. */
  function brushSpanAt(polygon, area, y) {
    const span = polygonSpanAtY(polygon, y) || { lo: area.minX, hi: area.maxX };
    let lo = Math.max(area.minX, span.lo);
    let hi = Math.min(area.maxX, span.hi);
    // Beside Header.png (icon in a top corner): while the brush is higher than
    // the header's bottom, keep its sweeps on its own side of the header.
    const hb = area.headerBlock;
    if (hb && y < hb.minTipY + 40) {
      // Eased over 40px so the sweep width changes smoothly, without a jump.
      const w = smoothstep((hb.minTipY + 40 - y) / 40);
      if (hb.side < 0) {
        const lim = Math.max(lo, hb.x0 - hb.reachRight);
        hi = Math.min(hi, hi + (lim - hi) * w);
      } else {
        const lim = Math.min(hi, hb.x1 + hb.reachLeft);
        lo = Math.max(lo, lo + (lim - lo) * w);
      }
      if (hi < lo) hi = lo;
    }
    const inset = Math.min(Math.max(0, hi - lo) * 0.15, 20);
    const left = lo + inset;
    return { left, right: Math.max(left, hi - inset) };
  }

  /**
   * Plans the brush route so it starts exactly at the icon (start point):
   * the first sweep leaves from there, the zig-zag first runs to the nearer
   * edge of the area (top or bottom), then turns and sweeps across to the
   * far edge.
   */
  function planBrushPath(polygon, area, start, stampRadius) {
    const top = area.minY + area.height * 0.14;
    const bottom = Math.max(top, area.maxY - area.height * 0.14);
    const y0 = Math.min(bottom, Math.max(top, start.y));
    const firstTo = y0 - top <= bottom - y0 ? top : bottom; // nearer edge first
    const secondTo = firstTo === top ? bottom : top;
    const leg1 = Math.abs(firstTo - y0);
    const leg2 = bottom - top;
    const total = Math.max(1, leg1 + leg2);

    const sweeps = Math.min(
      BRUSH_MAX_SWEEPS,
      Math.max(BRUSH_MIN_SWEEPS, Math.round(total / (stampRadius * 1.3)))
    );

    // Phase of the first sweep so that x starts exactly at the icon.
    const sp = brushSpanAt(polygon, area, y0);
    const r =
      sp.right > sp.left
        ? Math.min(1, Math.max(0, (start.x - sp.left) / (sp.right - sp.left)))
        : 0.5;
    // Head towards the wider side first.
    const u0 =
      r < 0.5
        ? Math.acos(1 - 2 * r) / Math.PI // sweeping right
        : 1 + Math.acos(1 - 2 * (1 - r)) / Math.PI; // sweeping left

    const plan = { y0, firstTo, secondTo, leg1, total, sweeps, u0, top, bottom, dx0: 0, dy0: 0 };
    // If the icon stands near the piece edge (outside the sweep zone), the
    // route still starts exactly at the icon and eases into the zone during
    // the first sweep.
    const p0 = brushPathPoint(polygon, area, 0, plan);
    plan.dx0 = start.x - p0.x;
    plan.dy0 = start.y - p0.y;
    return plan;
  }

  /**
   * Brush position at sweep progress s (0–1) along the planned route:
   * side-to-side sweeps that slow down at each turn like a flick of the
   * wrist, staying inside the piece. dir = +1 sweeping right, -1 left.
   */
  function brushPathPoint(polygon, area, s, plan) {
    const tt = Math.min(0.9999, Math.max(0, s));
    const u = plan.u0 + tt * plan.sweeps;
    const i = Math.floor(u);
    const f = u - i;
    const ease = 0.5 - 0.5 * Math.cos(Math.PI * f);
    const dir = i % 2 === 0 ? 1 : -1;

    const dist = tt * plan.total;
    let y;
    if (dist <= plan.leg1) {
      y = plan.y0 + Math.sign(plan.firstTo - plan.y0) * dist;
    } else {
      y = plan.firstTo + Math.sign(plan.secondTo - plan.firstTo) * (dist - plan.leg1);
    }
    // Slight arc through each sweep (fades in so the very start is exact).
    y -= Math.sin(Math.PI * f) * Math.min(10, area.height * 0.05) * Math.min(1, tt * 8);
    y = Math.min(plan.bottom, Math.max(plan.top - 10, y));

    const { left, right } = brushSpanAt(polygon, area, y);
    let x = dir > 0 ? left + (right - left) * ease : right - (right - left) * ease;

    // Start offset (icon outside the sweep zone) fades out over the first sweep.
    const w = 1 - smoothstep(tt * plan.sweeps);
    x += (plan.dx0 || 0) * w;
    y += (plan.dy0 || 0) * w;

    return { x, y, dir, turn: f };
  }

  function smoothstep(f) {
    const c = Math.min(1, Math.max(0, f));
    return c * c * (3 - 2 * c);
  }

  /**
   * Clears a piece: the icon's brush lifts off, sweeps side to side over a
   * local area around the number kicking up dust clouds, and the rest of the
   * piece dissolves as the brush finishes.
   * opts.startRect = where the icon brush was on screen (stage px).
   */
  function startBrushWipe(cellId, onDone, opts) {
    const polygon = cellPolygons.get(cellId);
    const cellEl = svgLayer.querySelector('.cell[data-cell-id="' + cellId + '"]');
    if (!polygon || !cellEl) {
      onDone();
      return;
    }

    if (!stateAImage.complete || stateAImage.naturalWidth === 0) {
      cellEl.classList.add("is-gone");
      commitDustHole(buildSoftCellMask(layoutWidth, layoutHeight, polygon));
      onDone();
      return;
    }

    const width = layoutWidth;
    const height = layoutHeight;
    const softEdge = buildSoftCellMask(width, height, polygon);
    const bbox = polygonBBox(polygon);
    const centre = cellIconSpots.get(cellId) || null;
    const area = localBrushArea(polygon, bbox, centre);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.className = "brush-wipe-canvas";
    vfxLayer.appendChild(canvas);
    const ctx = canvas.getContext("2d");

    const fxLayer = document.createElement("div");
    fxLayer.className = "brush-fx";
    vfxLayer.appendChild(fxLayer);

    const aspect =
      brushImage.naturalWidth > 0 ? brushImage.naturalHeight / brushImage.naturalWidth : 1;
    const brushW = BRUSH_SIZE_PX;
    const brushH = BRUSH_SIZE_PX * aspect;
    const tipX = brushW * BRUSH_TIP.x;
    const tipY = brushH * BRUSH_TIP.y;

    // The brush never goes under Header.png: where the brushed area lies
    // below the header, the whole brush (handle included) stays under its
    // bottom edge, so a piece under the header is only brushed below it.
    // Whatever is left under the header dissolves at the end, as usual.
    // Where the icon brush sat: the sprite starts exactly there, at icon size.
    const startRect = opts && opts.startRect;
    const startScale = startRect ? Math.max(0.2, startRect.w / brushW) : 0.8;
    const startTip = startRect
      ? { x: startRect.x + startRect.w * BRUSH_TIP.x, y: startRect.y + startRect.h * BRUSH_TIP.y }
      : centre || { x: area.minX, y: area.minY };

    let minTipY = -Infinity;
    let headerSideX = null;
    const header = headerRectPx();
    if (header) {
      const reachLeft = tipX + 10;
      const reachRight = brushW - tipX + 10;
      const overlapsHeaderX =
        area.minX - reachLeft < header.x + header.w &&
        area.maxX + reachRight > header.x;
      // Is the icon itself below the header, or beside it in a top corner?
      const iconBesideHeader =
        startTip.y - tipY * startScale < header.y + header.h + BRUSH_HEADER_GAP_PX &&
        (startTip.x + reachRight * startScale <= header.x ||
          startTip.x - reachLeft * startScale >= header.x + header.w);
      if (overlapsHeaderX && iconBesideHeader) {
        // Brush stays on its side of the header instead of being pushed down.
        headerSideX = {
          x0: header.x,
          x1: header.x + header.w,
          minTipY: header.y + header.h + BRUSH_HEADER_GAP_PX + tipY,
        };
        // Extra room for the brush leaning up to ~22° while it sweeps.
        const lean = brushH * 0.4;
        headerSideX.side = startTip.x < header.x + header.w / 2 ? -1 : 1;
        area.headerBlock = {
          minTipY: headerSideX.minTipY,
          x0: header.x,
          x1: header.x + header.w,
          side: headerSideX.side,
          reachLeft: reachLeft + lean,
          reachRight: reachRight + lean,
        };
      } else if (overlapsHeaderX) {
        minTipY = header.y + header.h + BRUSH_HEADER_GAP_PX + tipY;
        // The first sweep row sits 14% into the area, so start the area a bit higher.
        const needTop = minTipY;
        if (area.minY + area.height * 0.14 < needTop) {
          const bottom = Math.max(area.maxY, needTop + 60);
          const newMin = Math.max(area.minY, (needTop - 0.14 * bottom) / 0.86);
          area.minY = newMin;
          area.maxY = bottom;
          area.height = Math.max(1, area.maxY - area.minY);
        }
      }
    }

    const brushEl = document.createElement("img");
    brushEl.className = "brush-sprite";
    brushEl.src = brushImage.src;
    brushEl.alt = "";
    brushEl.draggable = false;
    brushEl.style.width = `${brushW}px`;
    brushEl.style.height = `${brushH}px`;
    // Rotate around the bristles, not the middle of the picture.
    brushEl.style.transformOrigin = `${tipX}px ${tipY}px`;
    fxLayer.appendChild(brushEl);

    // Swept-away dust accumulates here and is punched out of the piece.
    const swept = document.createElement("canvas");
    swept.width = width;
    swept.height = height;
    const sweptCtx = swept.getContext("2d");

    const stampRadius = BRUSH_TRAIL_RADIUS_PX;
    const stamp = buildSpongeStamp(stampRadius);
    // The bristles leave a wide, flat trail.
    const stampW = stampRadius * 2.5;
    const stampH = stampRadius * 1.7;
    const stampStep = stampRadius * 0.3;
    // The route starts exactly where the icon brush stood.
    const plan = planBrushPath(polygon, area, startTip, stampRadius);

    let finished = false;
    let svgHidden = false;
    let rafId = 0;
    let prevS = 0;
    let lastPuffAt = 0;
    let tilt = 0;
    const wipeClockStart = performance.now();

    function wipeProgress() {
      return Math.min(
        1,
        Math.max(0, (performance.now() - wipeClockStart) / WIPE_MS)
      );
    }

    /** Sweep progress (0–1) inside the sweeping part of the timeline. */
    function sweepProgress(t) {
      return Math.min(
        1,
        Math.max(0, (t - BRUSH_PICKUP_END) / (BRUSH_SWEEP_END - BRUSH_PICKUP_END))
      );
    }

    function cleanup() {
      if (finished) return;
      finished = true;
      cancelAnimationFrame(rafId);
      canvas.remove();
      fxLayer.remove();
      commitDustHole(softEdge);
      onDone();
    }

    /** Stamp the bristle footprint along the path travelled since last frame. */
    function sweepSegment(fromS, toS) {
      const a = brushPathPoint(polygon, area, fromS, plan);
      const b = brushPathPoint(polygon, area, toS, plan);
      if (toS <= fromS) return b;
      const steps = Math.max(
        1,
        Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / stampStep)
      );
      sweptCtx.globalCompositeOperation = "source-over";
      for (let i = 1; i <= steps; i++) {
        const p = brushPathPoint(polygon, area, fromS + (toS - fromS) * (i / steps), plan);
        sweptCtx.drawImage(stamp, p.x - stampW / 2, p.y - stampH / 2, stampW, stampH);
      }
      return b;
    }

    /** Dust clouds kicked up ahead of the bristles, drifting the way the brush moves. */
    function emitPuffs(p) {
      const now = performance.now();
      if (now - lastPuffAt < 45) return;
      lastPuffAt = now;
      const atTurn = p.turn > 0.85;
      const count = atTurn ? 4 : 2 + (Math.random() < 0.5 ? 2 : 0);
      for (let i = 0; i < count; i++) {
        const ahead = p.dir * (stampRadius * (0.5 + Math.random() * 0.7));
        const spreadY = (Math.random() - 0.5) * stampRadius * 1.3;
        spawnDustPuff(fxLayer, p.x + ahead, p.y + spreadY, {
          size: 16 + Math.random() * (atTurn ? 26 : 18),
          dx: p.dir * (28 + Math.random() * 40),
          dy: -(8 + Math.random() * 24) + spreadY * 0.3,
        });
      }
    }

    function renderFrame() {
      const t = wipeProgress();
      const sNow = sweepProgress(t);
      const p = sweepSegment(prevS, sNow);
      prevS = sNow;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, width, height);

      drawImageCover(ctx, stateAImage, 0, 0, width, height);
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(softEdge, 0, 0);

      ctx.globalCompositeOperation = "destination-out";
      ctx.drawImage(swept, 0, 0);

      // The rest of the piece (outside the brushed area) dissolves by the end.
      if (t > BRUSH_FADE_START) {
        const f = smoothstep((t - BRUSH_FADE_START) / (1 - BRUSH_FADE_START));
        ctx.fillStyle = `rgba(0,0,0,${f.toFixed(3)})`;
        ctx.fillRect(0, 0, width, height);
      }
      ctx.globalCompositeOperation = "source-over";

      redrawDust(softEdge);

      // Brush sprite: pick-up from the icon, sweep, then lift off.
      let bx;
      let by;
      let scale;
      let alpha = 1;
      let targetTilt;
      if (t < BRUSH_PICKUP_END) {
        // Grows from icon size right where the icon brush stood, then the
        // first sweep leaves from that same point.
        const k = smoothstep(t / BRUSH_PICKUP_END);
        const p0 = brushPathPoint(polygon, area, 0, plan);
        bx = startTip.x + (p0.x - startTip.x) * k;
        by = startTip.y + (p0.y - startTip.y) * k;
        scale = startScale + (1 - startScale) * k;
        targetTilt = 0;
      } else if (t < BRUSH_SWEEP_END) {
        bx = p.x;
        by = p.y;
        scale = 1;
        targetTilt = p.dir * 22 * Math.sin(Math.PI * Math.min(1, p.turn * 1.15 + 0.1));
        emitPuffs(p);
      } else {
        const k = smoothstep((t - BRUSH_SWEEP_END) / (1 - BRUSH_SWEEP_END));
        bx = p.x;
        by = p.y - k * 40;
        scale = 1 - 0.15 * k;
        alpha = 1 - k;
        targetTilt = 0;
      }
      // Keep the brush top under Header.png. The limit follows the brush's
      // current size, so at the start the small icon brush stays exactly
      // where it stood and is only eased down as it grows (if it has to).
      const tipLimit = minTipY - tipY * (1 - scale);
      if (by < tipLimit) by = tipLimit;
      if (headerSideX) {
        // Beside the header: never slide sideways under it (leaning included).
        const sideLimit = headerSideX.minTipY - tipY * (1 - scale);
        if (by < sideLimit) {
          // Room for the brush's current lean (none at the very start, so the
          // icon brush starts exactly where it stood).
          const lean = brushH * scale * Math.sin((Math.abs(tilt) * Math.PI) / 180) + 4;
          if (headerSideX.side < 0) {
            bx = Math.min(bx, headerSideX.x0 - (brushW - tipX) * scale - lean);
          } else {
            bx = Math.max(bx, headerSideX.x1 + tipX * scale + lean);
          }
        }
      }
      tilt += (targetTilt - tilt) * 0.35;
      brushEl.style.transform = [
        `translate(${(bx - tipX).toFixed(1)}px, ${(by - tipY).toFixed(1)}px)`,
        `rotate(${tilt.toFixed(2)}deg)`,
        `scale(${scale.toFixed(3)})`,
      ].join(" ");
      brushEl.style.opacity = alpha.toFixed(3);

      if (!svgHidden) {
        cellEl.classList.add("is-gone");
        svgHidden = true;
      }
    }

    function tick() {
      if (finished) return;
      renderFrame();
      if (wipeProgress() >= 1) {
        // Last of the dust puffs off as the piece finishes.
        burstDustPuffs(
          vfxLayer,
          (area.minX + area.maxX) / 2,
          (area.minY + area.maxY) / 2,
          14,
          Math.min(area.width, area.height) * 0.35
        );
        playSpongeSparkles(bbox);
        cleanup();
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    renderFrame();
    rafId = requestAnimationFrame(tick);
  }

  /** Few clean-shine sparkles once a piece is scrubbed. */
  function playSpongeSparkles(bbox) {
    const layer = document.createElement("div");
    layer.className = "sponge-sparkles";
    vfxLayer.appendChild(layer);

    const count = 5;
    let maxLife = 0;
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      const size = 12 + Math.random() * 14;
      const dur = 460 + Math.random() * 320;
      const delay = Math.random() * 260;
      el.className = "sponge-sparkle";
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.left = `${bbox.minX + Math.random() * bbox.width}px`;
      el.style.top = `${bbox.minY + Math.random() * bbox.height}px`;
      el.style.setProperty("--sparkle-dur", `${dur}ms`);
      el.style.setProperty("--sparkle-delay", `${delay}ms`);
      layer.appendChild(el);
      maxLife = Math.max(maxLife, dur + delay);
    }
    window.setTimeout(() => layer.remove(), maxLife + 120);
  }

  function setCurrencyDisplay(value, immediate) {
    if (!hudTopCountEl) return;
    currency = value;
    if (immediate) {
      if (currencyAnimRaf) cancelAnimationFrame(currencyAnimRaf);
      currencyAnimRaf = 0;
      displayCurrency = value;
      hudTopCountEl.textContent = String(Math.round(value));
      return;
    }
    animateCurrencyDown(value);
  }

  /** Tick the HUD counter down to the new total. */
  function animateCurrencyDown(target) {
    if (!hudTopCountEl) return;
    if (currencyAnimRaf) cancelAnimationFrame(currencyAnimRaf);

    const start = displayCurrency;
    const end = target;
    if (end >= start) {
      displayCurrency = end;
      hudTopCountEl.textContent = String(Math.round(end));
      currencyAnimRaf = 0;
      return;
    }

    const diff = start - end;
    const duration = Math.min(900, Math.max(380, diff * 14));
    const t0 = performance.now();

    function tick(now) {
      const t = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      displayCurrency = start + (end - start) * eased;
      hudTopCountEl.textContent = String(Math.round(displayCurrency));
      if (t < 1) {
        currencyAnimRaf = requestAnimationFrame(tick);
      } else {
        displayCurrency = end;
        hudTopCountEl.textContent = String(end);
        currencyAnimRaf = 0;
      }
    }

    currencyAnimRaf = requestAnimationFrame(tick);
  }

  /* ---------- Hint: pulse the numbers when the player is idle ---------- */
  /** Seconds-worth of idle time before the numbers pulse (ms). */
  const HINT_IDLE_MS = 3000;
  /** How many pulses, and how long one pulse takes (ms) — keep in sync with .cell-icon.is-hint in the CSS. */
  const HINT_PULSES = 2;
  const HINT_PULSE_MS = 750;
  /** After the pulses, wait for another idle period and pulse again (false: only once per scene). */
  const HINT_REPEAT = true;

  let hintTimer = 0;
  let hintEndTimer = 0;

  function hintBlocked() {
    return celebrating || rewardOpen || replayOpen || transitionBusy || splashOpen;
  }

  function stopHint() {
    window.clearTimeout(hintTimer);
    window.clearTimeout(hintEndTimer);
    iconsLayer
      .querySelectorAll(".cell-icon.is-hint")
      .forEach((el) => el.classList.remove("is-hint"));
  }

  /** Call whenever the player does something with the pieces (or a new scene starts). */
  function resetHintTimer() {
    stopHint();
    hintTimer = window.setTimeout(playHint, HINT_IDLE_MS);
  }

  function playHint() {
    if (hintBlocked()) return;
    const icons = iconsLayer.querySelectorAll(
      ".cell-icon:not(.is-gone):not(.is-fading):not(.is-cleaning)"
    );
    if (!icons.length) return;
    icons.forEach((el) => el.classList.add("is-hint"));
    hintEndTimer = window.setTimeout(() => {
      icons.forEach((el) => el.classList.remove("is-hint"));
      if (HINT_REPEAT) resetHintTimer();
    }, HINT_PULSES * HINT_PULSE_MS + 60);
  }

  function onIconTap(cellId, event) {
    // The player is playing: stop the hint and start counting idle time again.
    resetHintTimer();
    const cellEl = svgLayer.querySelector(`.cell[data-cell-id="${cellId}"]`);
    const iconEl = iconsLayer.querySelector(`.cell-icon[data-cell-id="${cellId}"]`);

    if (!cellEl || !iconEl) return;
    if (
      cellEl.classList.contains("is-gone") ||
      cellEl.classList.contains("is-wiping")
    ) {
      return;
    }

    const cost = Number(iconEl.dataset.cost) || 0;
    setCurrencyDisplay(Math.max(0, currency - cost), false);

    cellEl.classList.add("is-wiping");

    // The icon brush becomes the cleaning brush: remember where it is on
    // screen, then hide the number and the circle (and the icon itself —
    // the moving brush takes its place in the same frame).
    let startRect = null;
    const skuEl = iconEl.querySelector(".cell-icon-sku");
    if (skuEl) {
      const pa = playArea.getBoundingClientRect();
      const r = skuEl.getBoundingClientRect();
      const k = stageScale();
      if (r.width > 0) {
        startRect = {
          x: (r.left - pa.left) / k,
          y: (r.top - pa.top) / k,
          w: r.width / k,
          h: r.height / k,
        };
      }
    }
    iconEl.classList.add("is-cleaning");

    let tapAt = null;
    if (event && Number.isFinite(event.clientX) && Number.isFinite(event.clientY)) {
      const rect = playArea.getBoundingClientRect();
      const k = stageScale();
      tapAt = {
        x: (event.clientX - rect.left) / k,
        y: (event.clientY - rect.top) / k,
      };
    }

    const poly = cellPolygons.get(cellId);
    if (poly) {
      const bbox = polygonBBox(poly);
      const ox = tapAt ? tapAt.x : (bbox.minX + bbox.maxX) / 2;
      const oy = tapAt ? tapAt.y : (bbox.minY + bbox.maxY) / 2;
      burstDustPuffs(vfxLayer, ox, oy, 8, 18);
    }

    startBrushWipe(cellId, () => {
      cellEl.classList.remove("is-wiping");
      cellEl.classList.add("is-gone");
      iconEl.classList.add("is-gone");
      clearedCount += 1;
      if (clearedCount >= pieceCount) {
        startSceneComplete();
      }
    }, { startRect });
  }

  function formatReward(n) {
    return n.toLocaleString("en-US");
  }

  function clearCelebrate() {
    if (!celebrateLayer) return;
    celebrateLayer.classList.remove("is-active");
    celebrateLayer.innerHTML = "";
  }

  /** Random point over the picture, below the header (same band as numbers). */
  function randomScenePoint(width, height, padPx) {
    const b = iconBounds(width, height);
    const pad = Math.max(0, padPx || 0);
    const top = Math.max(0, b.minY - ICON_EXTENT_TOP_PX) + pad;
    const bottom = Math.min(height, b.maxY + ICON_EXTENT_BOTTOM_PX) - pad;
    return {
      x: pad + Math.random() * Math.max(1, width - pad * 2),
      y: top + Math.random() * Math.max(1, bottom - top),
    };
  }

  function playCelebrateFx() {
    if (!celebrateLayer) return;
    clearCelebrate();
    celebrateLayer.classList.add("is-active");

    const width = layoutWidth || getStageSize().width;
    const height = layoutHeight || getStageSize().height;

    // Soft glow over the picture, kept clear of the header.
    const glow = document.createElement("div");
    glow.className = "celebrate-glow";
    const b = iconBounds(width, height);
    const glowLeft = 0;
    const glowRight = width;
    const glowTop = Math.max(0, b.minY - ICON_EXTENT_TOP_PX);
    const glowBottom = height;
    const glowW = Math.max(40, glowRight - glowLeft);
    const glowH = Math.max(40, glowBottom - glowTop);
    glow.style.left = `${glowLeft}px`;
    glow.style.top = `${glowTop}px`;
    glow.style.width = `${glowW}px`;
    glow.style.height = `${glowH}px`;
    celebrateLayer.appendChild(glow);

    const count = 42;
    for (let i = 0; i < count; i++) {
      const kind = Math.random();
      const el = document.createElement("div");
      const size =
        kind < 0.3
          ? 18 + Math.random() * 12
          : kind < 0.65
            ? 13 + Math.random() * 9
            : 8 + Math.random() * 6;
      const pt = randomScenePoint(width, height, size * 0.4);
      el.className =
        kind < 0.4
          ? "celebrate-sparkle is-star"
          : kind < 0.72
            ? "celebrate-sparkle is-glint"
            : "celebrate-sparkle is-twinkle";
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.left = `${pt.x}px`;
      el.style.top = `${pt.y}px`;
      el.style.setProperty("--spark-delay", `${Math.random() * 1000}ms`);
      el.style.setProperty("--spark-dur", `${840 + Math.random() * 960}ms`);
      el.style.setProperty("--spark-rot", `${Math.random() * 40 - 20}deg`);
      celebrateLayer.appendChild(el);
    }
  }

  /** Feature end screen. Tap restarts the same scene. */
  function showRewardScreen() {
    rewardPopup.src = "assets/MakeOver_Reward_popup_INT.webp";
    rewardScreen.classList.remove("is-makeover", "is-replay");
    rewardScreen.hidden = false;
    rewardOpen = true;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => rewardScreen.classList.add("is-visible"));
    });
  }

  /** Sam cheers up once the scene is clean. */
  function setSamHappy(happy) {
    if (!samEl) return;
    samEl.classList.toggle("is-happy", happy);
    if (happy) playSamSparkles();
  }

  /** Sparkle burst over Sam at the moment he turns happy. */
  function playSamSparkles() {
    const rect = samRect();
    if (!rect) return;

    const layer = document.createElement("div");
    layer.className = "sam-sparkles";
    playArea.appendChild(layer);

    let maxLife = 0;
    for (let i = 0; i < 16; i++) {
      const el = document.createElement("span");
      const size = 16 + Math.random() * 22;
      const dur = 520 + Math.random() * 420;
      const delay = Math.random() * 520;
      el.className = "sponge-sparkle";
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      el.style.left = `${rect.x + Math.random() * rect.w}px`;
      el.style.top = `${rect.y + Math.random() * rect.h}px`;
      el.style.setProperty("--sparkle-dur", `${dur}ms`);
      el.style.setProperty("--sparkle-delay", `${delay}ms`);
      layer.appendChild(el);
      maxLife = Math.max(maxLife, dur + delay);
    }
    window.setTimeout(() => layer.remove(), maxLife + 150);
  }

  /* ---------- Falling gold stars + corner spotlights ---------- */
  /** Seconds over which the stars keep starting to fall from the top. */
  const STAR_RAIN_S = 1.8;
  /** How fast the stars fall: 1 = the old speed, 2 = twice as fast. */
  const RAIN_SPEED = 2.8;
  /** Total falling particles over the whole rain. */
  const RAIN_STARS = 46;
  const RAIN_SPARKLES = 80;
  const RAIN_DUST = 190;
  /** Spotlights: how wide the beam is (radians, half angle of its core). */
  const BEAM_HALF_ANGLE = 0.15;
  /** Brightness of the beams, 0–1. */
  const BEAM_INTENSITY = 0.85;
  /**
   * Motion: the beams appear low at the bottom, rise all the way up to the top of
   * the scene, hold there for a moment, then sink to the very bottom and fade out.
   * Angles are measured up from the floor, in radians.
   */
  const BEAM_LOW_ANGLE = 0.02;
  const BEAM_RISE_S = 0.9;
  const BEAM_HOLD_S = 0.25;
  const BEAM_LOWER_S = 0.8;
  /** The last part of the descent during which the beams fade out. */
  const BEAM_END_FADE_S = 0.3;
  /** How quickly the beams fade when the dark reward screen comes in. */
  const BEAM_FADE_S = 0.45;

  let fireworkSprites = null;

  function buildFireworkSprites() {
    if (fireworkSprites) return fireworkSprites;

    // Soft gold dust grain.
    const dust = document.createElement("canvas");
    dust.width = dust.height = 32;
    const dctx = dust.getContext("2d");
    const dg = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    dg.addColorStop(0, "rgba(255,248,205,1)");
    dg.addColorStop(0.3, "rgba(255,214,90,0.9)");
    dg.addColorStop(1, "rgba(255,170,30,0)");
    dctx.fillStyle = dg;
    dctx.fillRect(0, 0, 32, 32);

    // Five-point gold star with a glow.
    const star = document.createElement("canvas");
    star.width = star.height = 72;
    const sctx = star.getContext("2d");
    sctx.translate(36, 37);
    sctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + (i * Math.PI) / 5;
      const r = i % 2 === 0 ? 24 : 10.5;
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      if (i === 0) sctx.moveTo(x, y);
      else sctx.lineTo(x, y);
    }
    sctx.closePath();
    const sg = sctx.createLinearGradient(0, -24, 0, 24);
    sg.addColorStop(0, "#fff6bf");
    sg.addColorStop(0.5, "#ffcf3d");
    sg.addColorStop(1, "#e69500");
    sctx.shadowColor = "rgba(255,210,80,0.9)";
    sctx.shadowBlur = 10;
    sctx.fillStyle = sg;
    sctx.fill();
    sctx.shadowBlur = 0;
    sctx.lineJoin = "round";
    sctx.lineWidth = 1.4;
    sctx.strokeStyle = "rgba(255,244,190,0.9)";
    sctx.stroke();

    // Thin four-point sparkle glint.
    const spark = document.createElement("canvas");
    spark.width = spark.height = 64;
    const kctx = spark.getContext("2d");
    kctx.translate(32, 32);
    const halo = kctx.createRadialGradient(0, 0, 0, 0, 0, 22);
    halo.addColorStop(0, "rgba(255,250,215,0.9)");
    halo.addColorStop(0.4, "rgba(255,222,120,0.3)");
    halo.addColorStop(1, "rgba(255,200,80,0)");
    kctx.fillStyle = halo;
    kctx.fillRect(-32, -32, 64, 64);
    kctx.beginPath();
    kctx.moveTo(0, -30);
    kctx.quadraticCurveTo(2.5, -2.5, 30, 0);
    kctx.quadraticCurveTo(2.5, 2.5, 0, 30);
    kctx.quadraticCurveTo(-2.5, 2.5, -30, 0);
    kctx.quadraticCurveTo(-2.5, -2.5, 0, -30);
    kctx.closePath();
    kctx.shadowColor = "rgba(255,225,130,1)";
    kctx.shadowBlur = 8;
    kctx.fillStyle = "#fffbe6";
    kctx.fill();

    fireworkSprites = { dust, star, spark };
    return fireworkSprites;
  }

  let celebrationFx = null;

  /** Fade out (or remove at once) the spotlights and any stars still falling. */
  function stopCelebrationLights(immediate) {
    if (celebrationFx) celebrationFx.stop(immediate);
  }

  /** The dark reward screen is coming in: the spotlights fade away, stars finish falling. */
  function dimCelebrationBeams() {
    if (celebrationFx) celebrationFx.dimBeams();
  }

  /**
   * Gold stars, sparkles and dust fall from the top while two soft spotlights in
   * the bottom corners swing up once, come down from the top to the centre of
   * the scene and keep shining there until the dark reward screen appears.
   */
  function playCelebrationLights() {
    stopCelebrationLights(true);

    const width = layoutWidth || getStageSize().width;
    const height = layoutHeight || getStageSize().height;
    const sprites = buildFireworkSprites();

    const layer = document.createElement("div");
    layer.className = "spotlight-layer";
    const canvas = document.createElement("canvas");
    canvas.className = "spotlight-canvas";
    // Draw at screen resolution: the stage itself is scaled with a CSS transform.
    const k = Math.min(3, Math.max(1, stageScale() * (window.devicePixelRatio || 1)));
    canvas.width = Math.round(width * k);
    canvas.height = Math.round(height * k);
    layer.appendChild(canvas);
    playArea.appendChild(layer);
    const ctx = canvas.getContext("2d");

    const rand = (a, b) => a + Math.random() * (b - a);
    const particles = [];
    const emitted = { star: 0, spark: 0, dust: 0 };
    const totals = { star: RAIN_STARS, spark: RAIN_SPARKLES, dust: RAIN_DUST };

    function spawn(type) {
      const base = {
        type,
        x: rand(-10, width + 10),
        y: rand(-30, -8),
        tw: rand(0, 6.3),
        rot: rand(-0.4, 0.4),
        vr: 0,
      };
      if (type === "star") {
        Object.assign(base, {
          vx: rand(-45, 45), vy: rand(140, 270), gravity: rand(90, 160),
          size: rand(15, 30), twSpeed: rand(5, 9), rot: rand(0, 6.3), vr: rand(-4, 4),
        });
      } else if (type === "spark") {
        Object.assign(base, {
          vx: rand(-35, 35), vy: rand(120, 250), gravity: rand(70, 130),
          size: rand(14, 30), twSpeed: rand(9, 16), vr: rand(-1.2, 1.2),
        });
      } else {
        Object.assign(base, {
          vx: rand(-25, 25), vy: rand(110, 260), gravity: rand(80, 150),
          size: rand(5, 12), twSpeed: rand(10, 22),
        });
      }
      base.vy *= RAIN_SPEED;
      base.gravity *= RAIN_SPEED * RAIN_SPEED;
      base.age = 0;
      particles.push(base);
    }

    // Beam geometry: pivots just outside the bottom corners, aimed at the middle.
    const centre = { x: width / 2, y: height * 0.5 };
    const topPoint = { x: width / 2, y: -10 };
    const pivots = [
      { x: -8, y: height + 8, dir: 1 }, // left corner, shines to the right
      { x: width + 8, y: height + 8, dir: -1 }, // right corner, shines to the left
    ];
    pivots.forEach((p) => {
      // Elevation (up from the floor) of the line to the top-centre of the scene.
      p.topElev = Math.atan2(p.y - topPoint.y, Math.abs(topPoint.x - p.x));
    });
    const beamLen = Math.hypot(topPoint.x - pivots[0].x, topPoint.y - pivots[0].y) * 1.2;

    /**
     * One soft, scattered beam painted once into its own canvas (pointing right,
     * pivot at the left middle). Many faint cones of different widths blend into a
     * smooth falloff, and soft haze blobs along the axis make the light look diffused.
     */
    function buildBeamSprite() {
      const maxHa = BEAM_HALF_ANGLE * 1.9;
      const hStage = 2 * beamLen * Math.sin(maxHa) + 40;
      const sp = document.createElement("canvas");
      sp.width = Math.ceil(beamLen * k);
      sp.height = Math.ceil(hStage * k);
      const c = sp.getContext("2d");
      c.scale(k, k);
      c.translate(0, hStage / 2);
      c.globalCompositeOperation = "lighter";

      const CONES = 16;
      for (let i = 0; i < CONES; i++) {
        const f = i / (CONES - 1);
        // From a very wide faint cone down to a narrow brighter core.
        const ha = maxHa * (1 - f * 0.92);
        const a = 0.026 + 0.03 * f;
        const g = c.createLinearGradient(0, 0, beamLen, 0);
        g.addColorStop(0, `rgba(255,248,222,${Math.min(1, a * 2.2).toFixed(3)})`);
        g.addColorStop(0.4, `rgba(255,230,150,${(a * 1.5).toFixed(3)})`);
        g.addColorStop(1, "rgba(255,215,110,0)");
        c.fillStyle = g;
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(Math.cos(-ha) * beamLen, Math.sin(-ha) * beamLen);
        c.lineTo(Math.cos(ha) * beamLen, Math.sin(ha) * beamLen);
        c.closePath();
        c.fill();
      }

      // Haze: big soft blobs along the beam, wider the further they are from the lamp.
      for (let i = 0; i < 9; i++) {
        const x = beamLen * (0.08 + i * 0.1);
        const r = 45 + x * 0.3;
        const fall = 1 - x / beamLen;
        const g = c.createRadialGradient(x, 0, 0, x, 0, r);
        g.addColorStop(0, `rgba(255,236,170,${(0.1 * fall + 0.02).toFixed(3)})`);
        g.addColorStop(1, "rgba(255,220,130,0)");
        c.fillStyle = g;
        c.fillRect(x - r, -r, r * 2, r * 2);
      }

      // Lamp glow at the pivot.
      const lr = 120;
      const lamp = c.createRadialGradient(0, 0, 0, 0, 0, lr);
      lamp.addColorStop(0, "rgba(255,250,228,0.7)");
      lamp.addColorStop(0.35, "rgba(255,228,140,0.28)");
      lamp.addColorStop(1, "rgba(255,200,80,0)");
      c.fillStyle = lamp;
      c.fillRect(-lr, -lr, lr * 2, lr * 2);
      return sp;
    }
    const beamSprite = buildBeamSprite();

    /** 0 = beam lying along the floor, 1 = beam aimed at the top of the scene. */
    const BEAM_TOTAL_S = BEAM_RISE_S + BEAM_HOLD_S + BEAM_LOWER_S;
    function beamHeight(t) {
      if (t < BEAM_RISE_S) return smoothstep(t / BEAM_RISE_S);
      if (t < BEAM_RISE_S + BEAM_HOLD_S) return 1;
      return 1 - smoothstep((t - BEAM_RISE_S - BEAM_HOLD_S) / BEAM_LOWER_S);
    }

    const t0 = performance.now();
    let last = t0;
    let stopAt = 0;
    let beamsOffAt = 0;
    let rafId = 0;
    let done = false;

    function remove() {
      if (done) return;
      done = true;
      cancelAnimationFrame(rafId);
      layer.remove();
      if (celebrationFx === handle) celebrationFx = null;
    }

    const handle = {
      dimBeams() {
        if (!beamsOffAt) beamsOffAt = performance.now();
      },
      stop(immediate) {
        if (immediate) {
          remove();
          return;
        }
        if (stopAt) return;
        stopAt = performance.now();
        layer.classList.add("is-leaving");
        window.setTimeout(remove, 450);
      },
    };
    celebrationFx = handle;

    function frame(now) {
      if (done) return;
      const dt = Math.min(0.034, (now - last) / 1000);
      last = now;
      const t = (now - t0) / 1000;

      // Keep the rain going for STAR_RAIN_S seconds (not after the lights are told to stop).
      if (!stopAt && t < STAR_RAIN_S + 0.001) {
        const f = Math.min(1, t / STAR_RAIN_S);
        for (const type of ["star", "spark", "dust"]) {
          while (emitted[type] < totals[type] * f) {
            spawn(type);
            emitted[type] += 1;
          }
        }
      }

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(k, 0, 0, k, 0, 0);

      // Spotlights: appear at the bottom, rise to the middle, sink back down and vanish.
      // (They also fade at once if the dark reward screen comes in early.)
      const on = smoothstep(t / 0.2);
      const endFade = 1 - smoothstep((t - (BEAM_TOTAL_S - BEAM_END_FADE_S)) / BEAM_END_FADE_S);
      const off = beamsOffAt ? 1 - Math.min(1, (now - beamsOffAt) / 1000 / BEAM_FADE_S) : 1;
      const intensity = BEAM_INTENSITY * on * endFade * off * (0.96 + 0.04 * Math.sin(t * 3.1));
      const height01 = beamHeight(t);
      if (intensity > 0.004) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = Math.min(1, intensity);
        for (const p of pivots) {
          ctx.save();
          ctx.translate(p.x, p.y);
          const elev = BEAM_LOW_ANGLE + (p.topElev - BEAM_LOW_ANGLE) * height01;
          ctx.rotate(Math.atan2(-Math.sin(elev), p.dir * Math.cos(elev)));
          ctx.drawImage(beamSprite, 0, -beamSprite.height / (2 * k), beamSprite.width / k, beamSprite.height / k);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      // Falling stars, sparkles and dust.
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        p.vy = p.vy * Math.exp(-0.35 * dt) + p.gravity * dt;
        p.x += (p.vx + Math.sin(p.tw + p.age * 2.2) * 22) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        if (p.y > height + 40) {
          particles.splice(i, 1);
          continue;
        }

        const fadeIn = Math.min(1, p.age / 0.15);
        const fadeOut = 1 - smoothstep((p.y - (height - 90)) / 110);
        const alpha = Math.max(0, fadeIn * fadeOut);
        let size = p.size;

        if (p.type === "dust") {
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = alpha * (0.6 + 0.4 * Math.sin(p.tw + p.age * p.twSpeed));
          ctx.drawImage(sprites.dust, p.x - size / 2, p.y - size / 2, size, size);
        } else if (p.type === "spark") {
          size *= 0.55 + 0.6 * Math.abs(Math.sin(p.tw + p.age * p.twSpeed));
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = alpha;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.drawImage(sprites.spark, -size / 2, -size / 2, size, size);
          ctx.restore();
        } else {
          const flutter = 0.45 + 0.55 * Math.abs(Math.cos(p.tw + p.age * p.twSpeed));
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = alpha;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(flutter, 1);
          ctx.drawImage(sprites.star, -size / 2, -size / 2, size, size);
          ctx.restore();
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = alpha * 0.6 * Math.abs(Math.sin(p.tw * 2 + p.age * 14));
          const gs = size * 1.2;
          ctx.drawImage(sprites.spark, p.x - gs / 2, p.y - gs / 2, gs, gs);
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";

      // Once the beams are gone and the last star has fallen, the layer is done.
      if ((t > BEAM_TOTAL_S || off <= 0) && !particles.length && t > STAR_RAIN_S) {
        remove();
        return;
      }
      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);
  }

  function startSceneComplete() {
    if (celebrating || rewardOpen) return;
    celebrating = true;
    setSamHappy(true);
    // No corner spotlights or projector beams — go straight to the reward.
    stopCelebrationLights(true);
    clearCelebrate();
    window.setTimeout(() => {
      celebrating = false;
      showRewardScreen();
    }, 420);
  }

  /** Is the scene on screen the last one of the whole run? */
  function isLastGame() {
    return gameIndex === GAME_PIECES.length - 1;
  }

  /** A tap on the reward screen restarts the only scene. */
  function loadNextScene() {
    if (!rewardOpen || transitionBusy) return;
    rewardOpen = false;
    replayOpen = false;
    stopCelebrationLights(false);
    startNextGame(true);
  }

  /** Resolves once the pictures of the scene that was just set up are loaded (or after a short wait). */
  function sceneImagesReady() {
    return new Promise((resolve) => {
      const images = [stateAImage, stateBImg].filter(Boolean);
      const startedAt = performance.now();
      (function check() {
        const ready = images.every((img) => img.complete && img.naturalWidth > 0);
        if (ready || performance.now() - startedAt > 1500) resolve();
        else window.setTimeout(check, 40);
      })();
    });
  }

  let transitionBusy = false;

  /**
   * Fade the screen to black, change what is behind it, fade back in.
   * `change` runs while the screen is fully black.
   */
  function fadeThroughBlack(change) {
    if (transitionBusy) return;
    transitionBusy = true;
    blackout.classList.add("is-on");
    window.setTimeout(async () => {
      change();
      await sceneImagesReady();
      window.setTimeout(() => {
        blackout.classList.remove("is-on");
        window.setTimeout(() => {
          transitionBusy = false;
        }, 520);
      }, 300);
    }, 540);
  }

  /** Go to the next game (or the very first one again), through a black screen. */
  function startNextGame(fromStart) {
    fadeThroughBlack(() => {
      rewardScreen.hidden = true;
      rewardScreen.classList.remove("is-visible", "is-replay", "is-makeover");
      // Next game: more pieces (and the same number of icons).
      gameIndex = fromStart ? 0 : (gameIndex + 1) % GAME_PIECES.length;
      pieceCount = GAME_PIECES[gameIndex];
      sceneIndex = fromStart ? 0 : (sceneIndex + 1) % SCENES.length;
      applySceneArt(SCENES[sceneIndex]);
      siteLayout = null;
      layoutWidth = 0;
      layoutHeight = 0;
      buildScene();
    });
  }

  /** Replay pressed: back to the very first screen, everything starts over. */
  function restartGame() {
    if (!replayOpen || transitionBusy) return;
    replayOpen = false;
    startNextGame(true);
  }

  function init() {
    fitPlayAreaToArt();
    buildScene();
    measureSamArt();

    rewardScreen.addEventListener("click", loadNextScene);
    // Start screen: a tap fades through white into the first scene.
    splash.addEventListener("click", () => {
      if (!splashOpen || transitionBusy) return;
      splashOpen = false;
      transitionBusy = true;
      whiteout.classList.add("is-on");
      window.setTimeout(() => {
        splash.hidden = true;
        window.setTimeout(() => {
          whiteout.classList.remove("is-on");
          resetHintTimer();
          window.setTimeout(() => {
            transitionBusy = false;
          }, 520);
        }, 250);
      }, 540);
    });
    replayButton.addEventListener("click", (event) => {
      event.stopPropagation();
      restartGame();
    });

    const ro = new ResizeObserver(() => {
      buildScene();
    });
    ro.observe(playArea);

    window.addEventListener("orientationchange", () => {
      window.setTimeout(buildScene, 100);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

  </script>
  <!-- Phones only: the first tap switches to full screen (Android Chrome) and locks landscape. -->
  <script>
    (function () {
      var root = document.documentElement;

      function goFullScreen() {
        // iPhone Safari doesn't allow this for pages; use the Home Screen icon.
        if (!root.classList.contains("is-bare")) return;
        var req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
        try {
          var p = req.call(root);
          if (p && p.then) {
            p.then(function () {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function () {});
              }
            }).catch(function () {});
          }
        } catch (e) {}
      }

      document.addEventListener("pointerdown", goFullScreen, { once: true });
    })();
  </script>
</body>
